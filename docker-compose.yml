services:
  # Restricted Docker Socket Proxy: prevents direct root docker.sock exposure on the app container
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: deploymenthub-socket-proxy
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      BUILD: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      # Block high-risk Swarm/Node/Secret/Exec APIs
      SWARM: 0
      SECRETS: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      EXEC: 0
    networks:
      - hub_internal

  # Traefik v3 Reverse Proxy with Auto-SSL (Let's Encrypt)
  traefik:
    image: traefik:v3.0
    container_name: deploymenthub-traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=deploymenthub_proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_certs:/letsencrypt
    networks:
      - hub_internal
      - deploymenthub_proxy

  # DeploymentHub Control Plane (Go binary + embedded Web UI)
  deploymenthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploymenthub-control-plane
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
      - traefik
    ports:
      - "${PORT:-4180}:4180"
    environment:
      PORT: "4180"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      HUB_MASTER_KEY: "${HUB_MASTER_KEY:-change-me-32-byte-production-master-key}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-change-me-github-webhook-secret}"
    volumes:
      - hub_data:/data
    networks:
      - hub_internal
      - deploymenthub_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=deploymenthub_proxy"
      - "traefik.http.routers.deploymenthub.rule=Host(`${HUB_DOMAIN:-hub.localhost}`)"
      - "traefik.http.routers.deploymenthub.entrypoints=websecure"
      - "traefik.http.routers.deploymenthub.tls.certresolver=letsencrypt"
      - "traefik.http.services.deploymenthub.loadbalancer.server.port=4180"

networks:
  hub_internal:
    internal: true
  deploymenthub_proxy:
    name: deploymenthub_proxy
    driver: bridge

volumes:
  hub_data:
  letsencrypt_certs:
