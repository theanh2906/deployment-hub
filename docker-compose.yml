services:
  # Restricted Docker Socket Proxy: prevents direct root docker.sock exposure on the app container
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: deploymenthub-socket-proxy
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      BUILD: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_PAUSE: 1
      ALLOW_UNPAUSE: 1
      SYSTEM: 1
      # Enable Exec solely behind Firebase Google single-admin Auth Gate + localhost-only :4180
      EXEC: 1
      # Block high-risk Swarm/Node/Secret APIs
      SWARM: 0
      SECRETS: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
    networks:
      - hub_internal

  # Traefik v3 Reverse Proxy with Auto-SSL (Let's Encrypt)
  traefik:
    image: traefik:v3.6
    container_name: deploymenthub-traefik
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN:-}"
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=deploymenthub_proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-theanh2906@gmail.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_certs:/letsencrypt
      - traefik_dynamic:/etc/traefik/dynamic
    networks:
      - hub_internal
      - deploymenthub_proxy

  # DeploymentHub Control Plane (Go binary + embedded Web UI)
  deploymenthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploymenthub-control-plane
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PORT:-4180}:4180"
    environment:
      PORT: "4180"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      HUB_MASTER_KEY: "${HUB_MASTER_KEY:-change-me-32-byte-production-master-key}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-change-me-github-webhook-secret}"
      MAH_API_URL: "${MAH_API_URL:-http://127.0.0.1:4180}"
      MAH_API_TOKEN: "${MAH_API_TOKEN:-}"
      MAH_SERVER_HOST: "${MAH_SERVER_HOST:-}"
      MAH_DATA_FILE: "/data/mah_state.json"
      CLOUDFLARE_DATA_FILE: "/data/cloudflare.json"
      TRAEFIK_DYNAMIC_DIR: "/data/traefik-dynamic"
      STACKS_DIR: "/data/stacks"
      REGISTRIES_DATA_FILE: "/data/registries.json"
      WEBHOOKS_DATA_FILE: "/data/webhooks.json"
      VPS_PUBLIC_IP: "${VPS_PUBLIC_IP:-}"
      AUTH_ENFORCE_SETUP: "${AUTH_ENFORCE_SETUP:-true}"
      AUTH_ADMIN_EMAIL: "${AUTH_ADMIN_EMAIL:-theanh2906@gmail.com}"
      AUTH_DATA_FILE: "/data/auth.json"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-}"
      FIREBASE_API_KEY: "${FIREBASE_API_KEY:-}"
      FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
    volumes:
      - hub_data:/data
      - traefik_dynamic:/data/traefik-dynamic
    networks:
      - hub_internal
      - deploymenthub_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=deploymenthub_proxy"
      - "traefik.http.routers.deploymenthub.rule=Host(`${HUB_DOMAIN:-hub.localhost}`)"
      - "traefik.http.routers.deploymenthub.entrypoints=web"
      - "traefik.http.services.deploymenthub.loadbalancer.server.port=4180"

networks:
  hub_internal:
    internal: true
  deploymenthub_proxy:
    name: deploymenthub_proxy
    driver: bridge

volumes:
  hub_data:
  letsencrypt_certs:
  traefik_dynamic:
