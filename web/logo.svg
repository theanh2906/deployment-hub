<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182E" />
      <stop offset="100%" stop-color="#0B0D19" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="dhBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="dhGlow" cx="50%" cy="45%" r="55%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Delta Left Wing -->
    <linearGradient id="dhWingLeft" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Delta Right Wing -->
    <linearGradient id="dhWingRight" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Central Fusion Core -->
    <linearGradient id="dhCore" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Hex Foundation Gradients -->
    <linearGradient id="dhHexLeft" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="dhHexRight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dhDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#4F46E5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#dhBg)" stroke="url(#dhBorder)" stroke-width="1.5" />
  <circle cx="32" cy="30" r="22" fill="url(#dhGlow)" />

  <!-- Isometric Hex Base Platform (Infrastructure Layer) -->
  <g filter="url(#dhDropShadow)">
    <!-- Left Facet -->
    <path d="M32 50 L16 41 V32 L32 40 Z" fill="url(#dhHexLeft)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6" stroke-linejoin="round" />
    <!-- Right Facet -->
    <path d="M32 50 L48 41 V32 L32 40 Z" fill="url(#dhHexRight)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" stroke-linejoin="round" />
    <!-- Center Dividing Seam -->
    <line x1="32" y1="40" x2="32" y2="50" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Kinetic Supersonic Deployment Delta (Speed & Instant Deploy) -->
    <!-- Left Wing -->
    <path d="M32 14 L18 36 L32 31 Z" fill="url(#dhWingLeft)" />
    <!-- Right Wing -->
    <path d="M32 14 L46 36 L32 31 Z" fill="url(#dhWingRight)" />
    <!-- Center High-Energy Spine -->
    <path d="M32 13 L34.5 31 L32 33 L29.5 31 Z" fill="url(#dhCore)" />
    <!-- Thruster Vector Jet -->
    <path d="M30 33 L32 42 L34 33 L32 35 Z" fill="url(#dhCore)" opacity="0.9" />
  </g>

  <!-- Orbital Microservice Nodes -->
  <circle cx="32" cy="13" r="2.2" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1" />
  <circle cx="18" cy="36" r="1.8" fill="#C084FC" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="46" cy="36" r="1.8" fill="#22D3EE" stroke="#FFFFFF" stroke-width="0.8" />
</svg>