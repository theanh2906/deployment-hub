              <div class="flex flex-wrap items-center gap-1.5 text-[11px] font-mono">
                <code class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] text-sky-400">POST http://${esc(host)}:4180/mcp</code>
                <code class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] text-indigo-400">http://127.0.0.1:4180/api/v1/mah/mcp</code>
              </div>
            </div>
            ${renderMahMcpCodeBlockHtml('mcp-http-curl', httpMcpCurlCommand, 'bash')}
          </div>
          <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-3 text-xs text-emerald-500 flex items-start gap-2">
            <span>💡</span>
            <div><strong>Native Go MCP (${isLegacyJs ? 'Legacy Node .js Mode' : 'Native Go Binary Mode'}):</strong> Chạy trực tiếp từ binary <code class="font-mono">${esc(scriptPath)}</code> (${isLegacyJs ? 'Node.js stdio' : 'deploymenthub mcp stdio'}) hoặc gọi trực tiếp qua HTTP JSON-RPC <code class="font-mono">POST /mcp</code>. Yêu cầu máy cá nhân đã add SSH key (<code class="font-mono">ssh ${esc(user)}@${esc(host)}</code>) khi dùng qua SSH.</div>
          </div>
        </div>
      `;
    }

    function renderMahMcpGuide(snap, isMob) {
      const cfg = state.mah.config || {};
      const activeClient = state.mah.mcpClientTab || 'agy';
      const clientTabs = [
        { id: 'agy', label: '⚡ Antigravity CLI (agy)' },
        { id: 'claude', label: '🤖 Claude Code & Desktop' },
        { id: 'codex', label: '💻 OpenAI Codex' },
        { id: 'cursor', label: '🎯 Cursor IDE' }
      ];

      return `
        <div class="space-y-4">
          <!-- Connection Params Bar -->
          <section class="rounded-2xl border border-indigo-500/25 bg-gradient-to-br from-indigo-500/10 via-sky-500/5 to-[var(--card)] p-4 space-y-3 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-2">
              <div>
                <h2 class="text-sm font-semibold text-[var(--foreground)]">🔌 Global Native Go MCP Integration Guide</h2>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Kết nối bất kỳ AI Coding Assistant nào (Antigravity CLI, Claude Code, Codex, Cursor) với Native Go Multi-Agent Hub qua SSH Stdio (<code class="font-mono text-[var(--foreground)]">deploymenthub mcp</code>) hoặc HTTP JSON-RPC (<code class="font-mono text-[var(--foreground)]">/mcp</code>).</p>
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs px-2.5 py-1 rounded-full bg-sky-500/15 text-sky-400 border border-sky-500/30 font-medium">Transport: SSH Stdio &amp; HTTP /mcp</span>
                <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-medium">11 Native Go Tools</span>
              </div>
            </div>

            <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-1 md:grid-cols-6'} gap-2.5 items-end rounded-xl border border-[var(--border)] bg-[var(--card)] p-3">
              <div>
                <label class="block text-[11px] font-semibold uppercase text-[var(--muted-foreground)] mb-1">Server Host / IP</label>
                <input type="text" value="${esc(cfg.serverHost || defaultHost())}" oninput="onMahMcpParamChange('serverHost', this.value)" class="w-full px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold uppercase text-[var(--muted-foreground)] mb-1">SSH User</label>
                <input type="text" value="${esc(cfg.sshUser || 'root')}" oninput="onMahMcpParamChange('sshUser', this.value)" class="w-full px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
              </div>
              <div class="${isMob ? '' : 'md:col-span-2'}">
                <label class="block text-[11px] font-semibold uppercase text-[var(--muted-foreground)] mb-1">MCP Binary / Script Path</label>
                <input type="text" value="${esc(cfg.mcpScriptPath || 'deploymenthub')}" oninput="onMahMcpParamChange('mcpScriptPath', this.value)" class="w-full px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
              </div>
              <div class="${isMob ? '' : 'md:col-span-2'}">
                <label class="block text-[11px] font-semibold uppercase text-[var(--muted-foreground)] mb-1">Bearer Token (Synced with MAH Config)</label>
                <div class="flex gap-1.5">
                  <input type="text" value="${esc(cfg.apiToken || '')}" oninput="onMahMcpParamChange('apiToken', this.value)" placeholder="mah_wk_..." class="flex-1 px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
                  <button type="button" onclick="saveMahMcpParams()" class="px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] hover:bg-[var(--accent)] text-xs font-medium shrink-0">Lưu Config</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 4 Client Tabs -->
          <div class="flex flex-wrap items-center gap-2">
            ${clientTabs.map(ct => `
              <button type="button" onclick="setMahMcpClientTab('${ct.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${activeClient === ct.id ? 'bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white shadow-sm shadow-indigo-500/25' : 'bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--accent)]'}">
                ${esc(ct.label)}
              </button>
            `).join('')}
          </div>

          <section id="mahMcpClientContent" class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 shadow-sm">
            ${renderMahMcpClientPanel(snap, isMob)}
          </section>

          <!-- 11 Standardized MAH MCP Tools Reference Table -->
          <section class="rounded-2xl border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-sm">
            <div class="px-4 py-3 border-b border-[var(--border)]">
              <h3 class="text-sm font-semibold text-[var(--foreground)]">📦 Danh mục 11 Standardized MAH MCP Tools</h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">
                    <th class="py-2.5 px-4 font-semibold w-48">Tool Name</th>
                    <th class="py-2.5 px-3 font-semibold">Mô tả chức năng</th>
                    <th class="py-2.5 px-4 font-semibold w-32 text-right">Phân loại</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border)]">
                  ${MAH_MCP_TOOLS.map(tool => `
                    <tr class="hover:bg-[var(--content)]/60">
                      <td class="py-2.5 px-4"><code class="font-mono font-semibold text-sky-400">${esc(tool.name)}</code></td>
                      <td class="py-2.5 px-3 text-[var(--foreground)]">${esc(tool.desc)}</td>
                      <td class="py-2.5 px-4 text-right"><span class="text-[11px] px-2 py-0.5 rounded-full bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] font-medium">${esc(tool.category)}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // MAH Modals (Settings & Register Agent)
    // -------------------------------------------------------------------------
    function renderMahSettingsModalHtml(isMob, wrapperCls) {
      const f = state.mah.settingsForm || state.mah.config || {};
      return `
        <div class="${wrapperCls}" onclick="if(event.target===this) closeMahModals()">
          <form onsubmit="saveMahConfig(event)" class="w-full ${isMob ? '' : 'max-w-lg'} rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-indigo-500/15 text-indigo-400 flex items-center justify-center">${mahIconSvg('w-4 h-4')}</span>
                <div>
                  <div class="text-xs font-semibold text-[var(--foreground)]">Cấu hình MAH Control Plane API</div>
                  <div class="text-[11px] text-[var(--muted-foreground)]">Lưu kết nối REST API &amp; thông số SSH MCP</div>
                </div>
              </div>
              <button type="button" onclick="closeMahModals()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-1">Đóng</button>
            </div>

            <div class="p-4 space-y-3 text-xs">
              <div>
                <label class="block font-medium text-[var(--muted-foreground)] mb-1">MAH API URL</label>
                <input type="text" value="${esc(f.apiUrl || '')}" oninput="state.mah.settingsForm.apiUrl = this.value" placeholder="http://127.0.0.1:4180" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
              </div>
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="font-medium text-[var(--muted-foreground)]">API Bearer Token</label>
                  <button type="button" onclick="clearMahConfigToken()" class="text-[11px] text-rose-500 hover:underline">Clear Token</button>
                </div>
                <input id="mahCfgTokenInput" type="text" value="${esc(f.apiToken || '')}" oninput="state.mah.settingsForm.apiToken = this.value" placeholder="mah_wk_... (để trống nếu giữ token hiện tại)" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block font-medium text-[var(--muted-foreground)] mb-1">Server Host / IP</label>
                  <input type="text" value="${esc(f.serverHost || '')}" oninput="state.mah.settingsForm.serverHost = this.value" placeholder="${esc(defaultHost())}" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
                </div>
                <div>
                  <label class="block font-medium text-[var(--muted-foreground)] mb-1">SSH User</label>
                  <input type="text" value="${esc(f.sshUser || '')}" oninput="state.mah.settingsForm.sshUser = this.value" placeholder="root" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
                </div>
              </div>
              <div>
                <label class="block font-medium text-[var(--muted-foreground)] mb-1">MCP Server Binary / Script Path</label>
                <input type="text" value="${esc(f.mcpScriptPath || '')}" oninput="state.mah.settingsForm.mcpScriptPath = this.value" placeholder="deploymenthub" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
              </div>
            </div>

            <div class="px-4 py-3 border-t border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-end gap-2">
              <button type="button" onclick="closeMahModals()" class="px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] text-xs font-medium">Hủy</button>
              <button type="submit" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white text-xs font-semibold shadow-sm shadow-indigo-500/25">Lưu &amp; Kết nối</button>
            </div>
          </form>
        </div>
      `;
    }

    function renderMahRegisterAgentModalHtml(isMob, wrapperCls) {
      const f = state.mah.registerForm || {};
      return `
        <div class="${wrapperCls}" onclick="if(event.target===this) closeMahModals()">
          <form onsubmit="registerMahAgent(event)" class="w-full ${isMob ? '' : 'max-w-md'} rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-emerald-500/15 text-emerald-500 flex items-center justify-center">${mahIconSvg('w-4 h-4')}</span>
                <div>
                  <div class="text-xs font-semibold text-[var(--foreground)]">Đăng ký Logical Agent Mới</div>
                  <div class="text-[11px] text-[var(--muted-foreground)]">POST /api/v1/mah/agents</div>
                </div>
              </div>
              <button type="button" onclick="closeMahModals()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-1">Đóng</button>
            </div>

            <div class="p-4 space-y-3 text-xs">
              <div>
                <label class="block font-medium text-[var(--muted-foreground)] mb-1">Logical Name *</label>
                <input type="text" required value="${esc(f.logicalName || '')}" oninput="state.mah.registerForm.logicalName = this.value" placeholder="code-reviewer" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
                <div class="text-[11px] text-[var(--muted-foreground)] mt-1">Chỉ gồm chữ, số và <code class="font-mono">. _ -</code></div>
              </div>
              <div>
                <label class="block font-medium text-[var(--muted-foreground)] mb-1">Description</label>
                <textarea rows="2" oninput="state.mah.registerForm.description = this.value" placeholder="Performs AST-aware PR reviews & protocol validation..." class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)]">${esc(f.description || '')}</textarea>
              </div>
              <div>
                <label class="block font-medium text-[var(--muted-foreground)] mb-1">Capabilities (comma-separated)</label>
                <input type="text" value="${esc(f.capabilities || '')}" oninput="state.mah.registerForm.capabilities = this.value" placeholder="code_review, protocol_audit, go_testing" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]" />
              </div>
            </div>

            <div class="px-4 py-3 border-t border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-end gap-2">
              <button type="button" onclick="closeMahModals()" class="px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] text-xs font-medium">Hủy</button>
              <button type="submit" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white text-xs font-semibold shadow-sm shadow-indigo-500/25">+ Đăng ký Agent</button>
            </div>
          </form>
        </div>
      `;
    }

    // =========================================================================
    // 12. BOOTSTRAP
    // =========================================================================
    function renderAll() {
      renderHeader();
      renderWorkspace();
    }

    renderAll();
    initApp();
  </script>
</body>
</html>
