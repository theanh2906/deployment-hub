    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .pulse-dot {
      animation: pulseDot 1.4s ease-in-out infinite;
    }
    .dash-flow {
      stroke-dasharray: 6 6;
      animation: dashFlow 1.2s linear infinite;
    }
    .dot-canvas {
      background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px);
      background-size: 18px 18px;
    }
    .thin-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 9999px;
    }
    .phone-frame {
      width: 390px;
      max-width: 100%;
      height: 780px;
    }
  </style>
</head>

    async function apiFetch(path, opts = {}) {
      const normalized = path.startsWith('/api/v1')
        ? path
        : `/api/v1${path.startsWith('/') ? path : '/' + path}`;
      const headers = Object.assign({}, opts.headers || {});
      if (opts.body !== undefined && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), opts.timeoutMs || 8000) : null;
      try {
        const res = await fetch(normalized, {
          ...opts,
          headers,
          signal: controller ? controller.signal : undefined
        });
        const text = await res.text();
        let data = {};
        if (text) {
          try { data = JSON.parse(text); } catch { data = { raw: text }; }
        }
        if (!res.ok) {
          throw new Error(data.error || data.message || `HTTP ${res.status}`);
        }
        return data;
      } finally {
        if (timer) clearTimeout(timer);
      }

        const prevMap = new Map(state.projects.map(p => [p.id, p]));
        state.projects = data.projects.map((p, idx) => {
          const prev = prevMap.get(p.id);
          const defaultTrend = p.status === 'Stopped'
            ? [8, 6, 4, 2, 0, 0, 0, 0, 0]

            trend: Array.isArray(p.trend) && p.trend.length ? p.trend : ((prev && prev.trend) || defaultTrend)

      const min = Math.min(...vals, 0);

        : tone === 'warn'

        : tone === 'error'
        ? 'border-rose-500/40 bg-[var(--card)] text-[var(--foreground)] ring-2 ring-rose-500/15'
        : 'border-indigo-500/35 bg-[var(--card)] text-[var(--foreground)] ring-2 ring-indigo-500/15';

        ? 'bg-emerald-500'
        : tone === 'warn'
        ? 'bg-amber-500'
        : tone === 'error'
        ? 'bg-rose-500'
        : 'bg-indigo-500';
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl border shadow-lg text-xs font-medium transition-all ${toneClass}`;
      el.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span><span>${esc(message)}</span>`;
      stack.appendChild(el);
      setTimeout(() => {

    function drawTopologyWires() {
      const canvas = document.getElementById('topologyCanvas');
      const svg = document.getElementById('topologySvg');
      const gh = document.getElementById('topoNodeGithub');
      const tr = document.getElementById('topoNodeTraefik');
      if (!canvas || !svg || !gh || !tr || typeof canvas.getBoundingClientRect !== 'function') return;

      const cRect = canvas.getBoundingClientRect();
      const W = Math.max(1, Math.round(canvas.scrollWidth || cRect.width));
      const H = Math.max(1, Math.round(canvas.scrollHeight || cRect.height));
      if (W <= 1 || H <= 1) return;

      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('width', String(W));
      svg.setAttribute('height', String(H));

      const relLeft = (r) => Number((r.left - cRect.left).toFixed(1));
      const relRight = (r) => Number((r.right - cRect.left).toFixed(1));
      const relMidY = (r) => Number((r.top + r.height / 2 - cRect.top).toFixed(1));

      const bezier = (x1, y1, x2, y2, stroke, width, dashed, opacity) => {
        const cx = Number(((x1 + x2) / 2).toFixed(1));
        const d = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
        return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"${dashed ? ' class="dash-flow"' : ''} stroke-opacity="${opacity}"/>`;
      };

      const ghR = gh.getBoundingClientRect();
      const trR = tr.getBoundingClientRect();
      let paths = bezier(relRight(ghR), relMidY(ghR), relLeft(trR), relMidY(trR), '#6366f1', '2.2', true, '0.85');

      const services = canvas.querySelectorAll('[data-topo-service]');
      services.forEach(card => {
        const pid = card.getAttribute('data-topo-service');
        const proj = state.projects.find(p => p.id === pid);
        const isSel = state.selectedTopologyId === pid;
        const isStopped = proj && proj.status === 'Stopped';
        const stroke = isStopped ? '#f43f5e' : isSel ? '#6366f1' : '#0ea5e9';
        const width = isSel ? '2.6' : '1.8';
        const op = isSel ? '0.95' : '0.6';
        const sR = card.getBoundingClientRect();
        paths += bezier(relRight(trR), relMidY(trR), relLeft(sR), relMidY(sR), stroke, width, !isStopped, op);
      });

      const pg = document.getElementById('topoNodePostgres');
      if (pg) {
        const crmCard = canvas.querySelector('[data-topo-service="crm-fullstack-monorepo"]')
          || Array.from(services).find(el => {
            const p = state.projects.find(item => item.id === el.getAttribute('data-topo-service'));
            return p && p.stackKey === 'compose';
          });
        if (crmCard) {
          const cR = crmCard.getBoundingClientRect();
          const pR = pg.getBoundingClientRect();
          paths += bezier(relRight(cR), relMidY(cR), relLeft(pR), relMidY(pR), '#10b981', '2.2', true, '0.9');
        }
      }

      svg.innerHTML = paths;
    }

    let topoResizeTimer = null;
    if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {

    function openDomainQuick(domain) {

    async function quickRedeploy(id) {
      const p = state.projects.find(item => item.id === id);
      if (!p || p.status === 'Building...') return;
      p.status = 'Building...';
      p.updatedAt = 'Đang build Stage 2/5';
      p.logs.push(`${new Date().toISOString().slice(0,19)}Z [deploy] Triggered Quick Redeploy on branch ${p.branch}`);
      if (state.dashboardView === 'grid') renderProjectGrid();
      else renderMainView();
      showToast(`Đang redeploy ${p.name}...`, 'warn');

      if (canUseBackend()) {
        try {
          const updated = await apiFetch(`/projects/${encodeURIComponent(id)}/redeploy`, { method: 'POST' });
          await refreshOverview();
          renderHeader();
          if (state.activeTab === 'dashboard') renderMainView();
          showToast(`${p.name} đã deploy xong (${updated.commit || 'latest'})!`, 'success');
          return;
        } catch (err) {
          // Graceful fallback to local simulator when API unreachable
        }
      }

      setTimeout(() => {
        p.status = 'Running';
        const randHex = Math.random().toString(16).slice(2, 8);
        p.commit = `sha-${randHex}`;
        p.updatedAt = 'Vừa xong';
        p.cpu = Number((Math.random() * 6 + 2).toFixed(1));
        if (p.ramMb === 0) p.ramMb = 96;
        p.logs.push(`${new Date().toISOString().slice(0,19)}Z [traefik] Zero-downtime swap completed -> ${p.commit}`);
        state.containers.forEach(c => {
          if (c.project === p.name) {
            c.status = 'Running';
            c.uptime = 'Up vừa xong';
            if (c.ramMb === 0) c.ramMb = 64;
          }
        });
        syncVpsRamFromContainers();
        renderHeader();
        if (state.activeTab === 'dashboard') renderMainView();
        showToast(`${p.name} đã deploy xong (${p.commit})!`, 'success');
      }, 1800);
    }

    async function toggleRestartProject(id) {
      const p = state.projects.find(item => item.id === id);
      if (!p) return;

      if (canUseBackend()) {
        const wasStopped = p.status === 'Stopped';
        p.status = wasStopped ? 'Building...' : 'Restarting...';
        renderMainView();
        try {
          await apiFetch(`/projects/${encodeURIComponent(id)}/restart`, { method: 'POST' });
          await refreshOverview();
          renderHeader();
          renderMainView();
          showToast(wasStopped ? `Đã khởi động ${p.name}` : `Đã restart ${p.name} thành công`, 'success');
          return;
        } catch (err) {
          // Graceful fallback to local simulator
        }
      }

      if (p.status === 'Stopped') {
        p.status = 'Running';
        p.cpu = 2.1;
        p.ramMb = 36;
        p.reqPerSec = '95 req/s';
        p.trend = [0, 4, 8, 12, 16, 14, 18, 20, 22];
        p.updatedAt = 'Vừa khởi động';
        p.logs.push(`${new Date().toISOString().slice(0,19)}Z [docker] Container started`);
        state.containers.forEach(c => {
          if (c.project === p.name) {
            c.status = 'Running';
            c.cpuPct = 2.1;
            c.ramMb = 36;
            c.uptime = 'Up vừa xong';
          }
        });
        showToast(`Đã khởi động ${p.name}`, 'success');
      } else {
        p.status = 'Restarting...';
        p.logs.push(`${new Date().toISOString().slice(0,19)}Z [docker] Restarting container...`);
        setTimeout(() => {
          p.status = 'Running';
          p.updatedAt = 'Vừa restart';
          p.logs.push(`${new Date().toISOString().slice(0,19)}Z [docker] Healthcheck passed (200 OK)`);
          state.containers.forEach(c => {
            if (c.project === p.name) {
              c.status = 'Running';
              c.uptime = 'Up vừa restart';
            }
          });
          if (state.activeTab === 'dashboard') renderMainView();
          showToast(`Đã restart ${p.name} thành công`, 'success');
        }, 900);
      }
      syncVpsRamFromContainers();
      renderHeader();
      renderMainView();
    }

            <button type="button" onclick="goWizardStep(2)" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white text-xs font-semibold shadow-sm shadow-indigo-500/25 hover:opacity-95 transition">
              Tiếp tục Bước 2: Auto-Detect Stack →
            </button>
          </div>
        </div>
      `;
    }

    function inferPresetFromRepoStr(repoStr) {
      const lower = String(repoStr || '').toLowerCase();
      if (lower.includes('monorepo') || lower.includes('fullstack') || lower.includes('compose')) return 'compose';
      if (lower.includes('rust') || lower.includes('actix') || lower.includes('cargo')) return 'rust';
      if (lower.includes('go') || lower.includes('golang') || lower.includes('billing')) return 'go';
      if (lower.includes('angular') || lower.includes('react') || lower.includes('vite') || lower.includes('spa')) return 'spa';
      return 'nextjs';
    }

    function syncAutoDetectForCurrentRepo(shouldApplyPreset = true) {
      const w = state.wizard;
      const source = w.scmMode === 'oauth' ? w.oauthRepo : w.patRepoUrl;
      const matchedOAuth = w.scmMode === 'oauth' ? OAUTH_REPOS.find(r => r.repo === w.oauthRepo) : null;
      const resolved = matchedOAuth ? matchedOAuth.preset : inferPresetFromRepoStr(source);
      const profile = AUTO_DETECT_PROFILES[resolved] || AUTO_DETECT_PROFILES.nextjs;

      w.autoResolvedPreset = resolved;
      w.detectedFiles = [...profile.files];
      w.aiInsight = profile.aiInsight;
      w.scanMeta = w.detectMode === 'hybrid'
        ? '99% Match • 85ms (Trees API + AI)'
        : '94% Match • 18ms (Trees API Rule-based)';

      if (shouldApplyPreset && w.presetSelection === 'auto') {
        applyWizardPreset(resolved, false);
      }
    }

    function setScmMode(mode) {
      state.wizard.scmMode = mode;
      syncAutoDetectForCurrentRepo(true);
      renderMainView();
    }

    function selectOAuthRepo(repo, preset) {
      const slug = repo.split('/').pop();
      state.wizard.oauthRepo = repo;
      state.wizard.appName = slug;
      state.wizard.domain = `${slug.split('-')[0]}.anna.dev`;
      state.wizard.presetSelection = 'auto';
      syncAutoDetectForCurrentRepo(false);
      applyWizardPreset(preset, false);
      renderMainView();
    }

      state.wizard.patRepoUrl = 'https://github.com/my-org/private-go-api.git';
      state.wizard.appName = 'private-go-api';
      state.wizard.domain = 'private-api.anna.dev';
      state.wizard.patError = '';
      syncAutoDetectForCurrentRepo(true);
      renderMainView();
    }

    function applyDetectResultToWizard(res, applyConfig = true) {
      if (!res || typeof res !== 'object') return;
      const w = state.wizard;
      if (res.presetKey && STACK_PRESETS[res.presetKey]) {
        w.autoResolvedPreset = res.presetKey;
      }
      if (Array.isArray(res.detectedFiles) && res.detectedFiles.length) {
        w.detectedFiles = res.detectedFiles;
      }
      if (res.insight) {
        w.aiInsight = res.insight;
      }
      if (res.mode) {
        w.detectMode = res.mode;
      }
      const conf = res.confidence || 99;
      const dur = res.scanDurationMs || 18;
      w.scanMeta = `${conf}% Match • ${dur}ms (${(res.mode || w.detectMode) === 'hybrid' ? 'Go Trees + AI' : 'Go File Rule-based'})`;
      w.serverDockerfile = res.dockerfile || '';

      if (applyConfig) {
        if (res.presetKey && STACK_PRESETS[res.presetKey]) w.presetKey = res.presetKey;
        if (res.buildCmd) w.buildCmd = res.buildCmd;
        if (res.startCmd) w.startCmd = res.startCmd;
        if (res.portMapping) w.portMapping = res.portMapping;
        if (Array.isArray(res.envVars) && res.envVars.length) {
          w.envVars = res.envVars.map(ev => ({ key: ev.key || '', value: ev.value || '', secret: Boolean(ev.secret) }));
        }
      }
    }

    async function syncDetectFromServer(modeOverride, applyConfig = true) {
      if (!canUseBackend()) return false;
      const w = state.wizard;
      const repoUrl = w.scmMode === 'oauth' ? w.oauthRepo : w.patRepoUrl;
      const branch = w.scmMode === 'oauth' ? w.oauthBranch : w.patBranch;
      const mode = modeOverride || w.detectMode;
      try {
        const res = await apiFetch('/detect', {
          method: 'POST',
          body: JSON.stringify({ repoUrl, branch, mode })
        });
        applyDetectResultToWizard(res, applyConfig);
        return true;
      } catch (err) {
        return false;
      }
    }

    async function syncDockerfileFromServer() {
      if (!canUseBackend()) return false;
      const w = state.wizard;
      try {
        const res = await apiFetch('/detect/dockerfile', {
          method: 'POST',
          body: JSON.stringify({
            presetKey: w.presetKey,
            mode: w.detectMode,
            appName: w.appName,
            domain: w.domain,
            buildCmd: w.buildCmd,
            startCmd: w.startCmd,
            portMapping: w.portMapping,
            envVars: w.envVars
          })
        });
        if (res && res.dockerfile) {
          w.serverDockerfile = res.dockerfile;
          const box = document.getElementById('dockerfilePreview');
          if (box && state.activeTab === 'wizard' && w.step === 2) {
            box.innerHTML = highlightCodeHtml(res.dockerfile);
          }
          return true;
        }
      } catch (err) {
        // Silent client-side Dockerfile fallback
      }
      return false;
    }

    function scheduleServerDockerfileSync() {
      state.wizard.serverDockerfile = '';
      if (!canUseBackend()) return;
      if (dfSyncTimer) clearTimeout(dfSyncTimer);
      dfSyncTimer = setTimeout(() => {
        syncDockerfileFromServer();
      }, 260);
    }

    async function validatePatImport() {
      const w = state.wizard;
      if (!w.patToken.trim() || !w.patRepoUrl.trim()) {
        w.patError = 'Vui lòng nhập GitHub PAT và Repo URL (hoặc bấm "Điền Token mẫu").';
        w.patVerified = false;
        renderMainView();
        return;
      }
      w.patError = '';
      w.patChecking = true;
      renderMainView();

      if (canUseBackend()) {
        try {
          const res = await apiFetch('/scm/verify-pat', {
            method: 'POST',
            body: JSON.stringify({ token: w.patToken.trim(), repoUrl: w.patRepoUrl.trim() })
          });
          w.patChecking = false;
          w.patVerified = Boolean(res.valid);
          w.presetSelection = 'auto';
          if (res.detectResult) {
            applyDetectResultToWizard(res.detectResult, true);
          } else {
            syncAutoDetectForCurrentRepo(true);
          }
          renderMainView();
          const label = STACK_PRESETS[w.autoResolvedPreset]?.label || w.autoResolvedPreset;
          showToast(`Xác thực PAT (${res.encryptedTokenPreview || 'AES-256-GCM'}) → ${label}!`, 'success');
          return;
        } catch (err) {
          const msg = err && err.message ? err.message : '';
          if (msg && !/fetch|network|abort/i.test(msg)) {
            w.patChecking = false;
            w.patVerified = false;
            w.patError = msg;
            renderMainView();
            return;
          }
          // Unreachable backend -> graceful simulator fallback
        }
      }

      setTimeout(() => {
        w.patChecking = false;
        w.patVerified = true;
        w.presetSelection = 'auto';
        syncAutoDetectForCurrentRepo(true);
        renderMainView();
        showToast(`Xác thực PAT & Auto-Detect → ${STACK_PRESETS[w.autoResolvedPreset].label}!`, 'success');
      }, 650);
    }

    function applyWizardPreset(presetKey, shouldRender = true) {
      const p = STACK_PRESETS[presetKey];
      if (!p) return;
      state.wizard.presetKey = presetKey;
      state.wizard.buildCmd = p.buildCmd;
      state.wizard.startCmd = p.startCmd;
      state.wizard.portMapping = p.portMapping;
      state.wizard.envVars = JSON.parse(JSON.stringify(p.envVars));
      state.wizard.serverDockerfile = '';
      if (shouldRender) renderMainView();
    }

    function selectPresetCard(choice) {
      const w = state.wizard;
      if (choice === 'auto') {
        w.presetSelection = 'auto';
        syncAutoDetectForCurrentRepo(true);
        renderMainView();
        if (canUseBackend()) {
          syncDetectFromServer(w.detectMode, true).then(ok => {
            if (ok && state.activeTab === 'wizard' && w.step === 2) renderMainView();
          });
        }
        showToast(`Auto-Detect chọn ${STACK_PRESETS[w.autoResolvedPreset].label}`, 'info');
      } else {
        w.presetSelection = choice;
        applyWizardPreset(choice, true);
        if (canUseBackend()) syncDockerfileFromServer();
      }
    }

    async function setDetectMode(mode) {
      const w = state.wizard;
      w.detectMode = mode;
      w.serverDockerfile = '';
      syncAutoDetectForCurrentRepo(w.presetSelection === 'auto');
      renderMainView();
      showToast(
        mode === 'hybrid'
          ? 'Đã bật Hybrid: File Scan + AI Smart Assist'
          : 'Đã chuyển sang Detect bằng File (Rule-based, 0 Token)',
        'info'
      );
      if (canUseBackend()) {
        const ok = w.presetSelection === 'auto'
          ? await syncDetectFromServer(mode, true)
          : await syncDockerfileFromServer();
        if (ok && state.activeTab === 'wizard' && w.step === 2) renderMainView();
      }
    }

    async function runAutoDetectScan() {
      const w = state.wizard;
      if (scanTimer) clearTimeout(scanTimer);
      w.isScanning = true;
      w.presetSelection = 'auto';
      w.serverDockerfile = '';
      renderMainView();

      if (canUseBackend()) {
        const ok = await syncDetectFromServer(w.detectMode, true);
        if (ok) {
          w.isScanning = false;
          renderMainView();
          const label = STACK_PRESETS[w.autoResolvedPreset]?.label || w.autoResolvedPreset;
          showToast(`Quét Repo hoàn tất → Phát hiện ${label} (${w.detectMode === 'hybrid' ? 'File + AI' : 'File Scan'})`, 'success');
          return;
        }

      scanTimer = setTimeout(() => {
        w.isScanning = false;
        syncAutoDetectForCurrentRepo(true);
        renderMainView();
        const label = STACK_PRESETS[w.autoResolvedPreset].label;
        showToast(`Quét Repo hoàn tất → Phát hiện ${label} (${w.detectMode === 'hybrid' ? 'File + AI' : 'File Scan'})`, 'success');
      }, 550);
    }

    function clearDeployTimers() {
      deployTimers.forEach(t => clearTimeout(t));
      deployTimers = [];
      if (activeDeploySource) {
        try { activeDeploySource.close(); } catch {}
        activeDeploySource = null;
      }
    }

    function runSimulatedDeploy() {
      const w = state.wizard;
      const preset = STACK_PRESETS[w.presetKey];
      w.deployStatus = 'running';
      w.deployStage = 1;
      if (!w.deployLogs.length) {
        w.deployLogs = [
          `$ deploymenthub deploy ${w.appName} --detect=${w.detectMode} --preset=${w.presetKey} --ssl=${w.domain}`
        ];
      }
      w.deployedOnce = false;
      renderMainView();

      const lines = preset.buildLogs;
      lines.forEach((line, idx) => {
        const t = setTimeout(() => {
          const stageNum = Math.min(5, Math.floor((idx / lines.length) * 5) + 1);
          w.deployStage = stageNum;
          w.deployLogs.push(`${new Date().toISOString().slice(11,19)} ${line}`);

          if (idx === lines.length - 1) {
            w.deployStage = 5;
            w.deployStatus = 'success';
            syncNewlyDeployedProject();
            showToast(`Deploy ${w.appName} thành công!`, 'success');
          }

          if (state.activeTab === 'wizard' && w.step === 3) {
            renderMainView();
            const term = document.getElementById('wizardTerminal');
            if (term) term.scrollTop = term.scrollHeight;
          }
        }, (idx + 1) * 420);
        deployTimers.push(t);
      });
    }

    async function startE2EDeploy() {
      clearDeployTimers();
      const w = state.wizard;
      const repoUrl = w.scmMode === 'oauth' ? w.oauthRepo : w.patRepoUrl;
      const branch = w.scmMode === 'oauth' ? w.oauthBranch : w.patBranch;

      if (!canUseBackend()) {
        runSimulatedDeploy();
        return;
      }

      w.deployStatus = 'running';
      w.deployStage = 1;
      w.deployId = '';
      w.deployLogs = [
        `$ deploymenthub deploy ${w.appName} --detect=${w.detectMode} --preset=${w.presetKey} --ssl=${w.domain}`
      ];
      w.deployedOnce = false;
      renderMainView();

      try {
        const rec = await apiFetch('/deployments', {
          method: 'POST',
          body: JSON.stringify({
            appName: w.appName,
            repoUrl,
            branch,
            domain: w.domain,
            scmMode: w.scmMode,
            pat: w.patToken,
            detectMode: w.detectMode,
            presetKey: w.presetKey,
            buildCmd: w.buildCmd,
            startCmd: w.startCmd,
            portMapping: w.portMapping,
            autoWebhook: w.autoWebhook,
            envVars: w.envVars
          })
        });
        const deployId = rec && rec.id;
        if (!deployId || typeof EventSource !== 'function') {
          runSimulatedDeploy();
          return;
        }
        w.deployId = deployId;

        const finishRemoteDeploy = async (isFailed) => {
          clearDeployTimers();
          w.deployStage = 5;
          w.deployStatus = isFailed ? 'error' : 'success';
          w.deployedOnce = true;
          await refreshOverview();
          renderAll();
          const term = document.getElementById('wizardTerminal');
          if (term) term.scrollTop = term.scrollHeight;
          showToast(
            isFailed ? `Deploy ${w.appName} gặp lỗi.` : `Deploy ${w.appName} thành công!`,
            isFailed ? 'error' : 'success'
          );
        };

        const streamUrl = `/api/v1/deployments/${encodeURIComponent(deployId)}/stream`;
        const es = new EventSource(streamUrl);
        activeDeploySource = es;

        es.onmessage = (ev) => {
          let evt = null;
          try { evt = JSON.parse(ev.data); } catch { return; }
          if (!evt) return;
          if (evt.stage) w.deployStage = Math.max(w.deployStage, Number(evt.stage));
          if (evt.line && w.deployLogs[w.deployLogs.length - 1] !== evt.line) {
            w.deployLogs.push(evt.line);
          }
          if (state.activeTab === 'wizard' && w.step === 3) {
            renderMainView();
            const term = document.getElementById('wizardTerminal');
            if (term) term.scrollTop = term.scrollHeight;
          }
          if (evt.done) {
            finishRemoteDeploy(evt.status === 'failed');
          }
        };

        es.onerror = () => {
          if (w.deployStatus !== 'running') return;
          if (activeDeploySource === es) {
            try { es.close(); } catch {}
            activeDeploySource = null;
          }
          const poll = async () => {
            try {
              const latest = await apiFetch(`/deployments/${encodeURIComponent(deployId)}`);
              if (latest && Array.isArray(latest.logs) && latest.logs.length) {
                w.deployLogs = latest.logs;
              }
              if (latest && latest.stage) w.deployStage = latest.stage;
              if (latest && (latest.status === 'success' || latest.status === 'failed')) {
                await finishRemoteDeploy(latest.status === 'failed');
              } else {
                const t = setTimeout(poll, 450);
                deployTimers.push(t);
              }
            } catch {
              runSimulatedDeploy();
            }
          };
          const t = setTimeout(poll, 350);
          deployTimers.push(t);
        };
      } catch (err) {
        w.deployLogs = [];
        runSimulatedDeploy();
      }
    }

    function syncNewlyDeployedProject() {
      const w = state.wizard;
      if (w.deployedOnce) return;
      w.deployedOnce = true;

      const preset = STACK_PRESETS[w.presetKey];
      const existing = state.projects.find(p => p.name === w.appName);

      const branch = w.scmMode === 'oauth' ? w.oauthBranch : w.patBranch;

          category: preset.category,

    function applyLocalContainerAction(id, action, targetTag = '') {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;
      if (action === 'stop') {
        c.status = 'Stopped';
        c.cpuPct = 0;
        c.ramMb = 0;
        c.uptime = 'Stopped vừa xong';
        c.logs.push('[docker] Container stopped by user');
        showToast(`Đã dừng container ${c.name}`, 'warn');
      } else if (action === 'start') {
        c.status = 'Running';
        c.cpuPct = 2.4;
        c.ramMb = Math.min(c.ramLimitMb, 64);
        c.uptime = 'Up vừa xong';
        c.logs.push('[docker] Container started & passing healthcheck');
        showToast(`Đã bật container ${c.name}`, 'success');
      } else if (action === 'restart') {
        c.status = 'Restarting...';
        renderMainView();
        setTimeout(() => {
          c.status = 'Running';
          c.cpuPct = Number((Math.random() * 4 + 1.5).toFixed(1));
          if (c.ramMb === 0) c.ramMb = 48;
          c.uptime = 'Up vừa restart';
          c.logs.push('[docker] Container restarted cleanly');
          syncVpsRamFromContainers();
          renderHeader();
          if (state.activeTab === 'docker') renderMainView();
          showToast(`Restart ${c.name} hoàn tất!`, 'success');
        }, 850);
        return;
      } else if (action === 'rollback' && targetTag) {
        const oldTag = c.image;
        c.image = targetTag;
        if (!c.previousTags.includes(oldTag)) c.previousTags.unshift(oldTag);
        c.status = 'Running';
        c.uptime = 'Up (Rollback vừa xong)';
        c.logs.push(`[rollback] Switched image ${oldTag} -> ${targetTag} (zero-downtime)`);
        closeModal();
        showToast(`Đã rollback ${c.name} về ${targetTag}!`, 'success');
      }

      const siblingCnts = state.containers.filter(x => x.project === c.project);
      const anyRunning = siblingCnts.some(x => x.status === 'Running');
      const proj = state.projects.find(p => p.name === c.project);
      if (proj) {
        proj.status = anyRunning ? 'Running' : 'Stopped';
        proj.ramMb = siblingCnts.reduce((s, x) => s + x.ramMb, 0);
        proj.cpu = Number(siblingCnts.reduce((s, x) => s + x.cpuPct, 0).toFixed(1));
      }
      syncVpsRamFromContainers();
      renderHeader();
      renderMainView();
    }

    async function containerAction(id, action, targetTag = '') {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;

      if (canUseBackend()) {
        try {
          await apiFetch(`/containers/${encodeURIComponent(id)}/action`, {
            method: 'POST',
            body: JSON.stringify({ action, targetTag })
          });
          if (action === 'rollback') closeModal();
          await refreshOverview();
          renderAll();
          const msgMap = {
            stop: `Đã dừng container ${c.name}`,
            start: `Đã bật container ${c.name}`,
            restart: `Restart ${c.name} hoàn tất!`,
            rollback: `Đã rollback ${c.name} về ${targetTag}!`
          };
          showToast(msgMap[action] || `Thao tác ${action} hoàn tất`, action === 'stop' ? 'warn' : 'success');
          return;
        } catch (err) {
          // Graceful local fallback when API unreachable
        }
      }

      applyLocalContainerAction(id, action, targetTag);
    }

    function toggleContainerPower(id) {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;
      return containerAction(id, c.status === 'Running' ? 'stop' : 'start');
    }

    function restartContainer(id) {
      return containerAction(id, 'restart');
    }

    async function pruneDanglingImages() {
      const dangling = state.images.filter(i => i.dangling);
      if (!dangling.length) return;

      if (canUseBackend()) {
        try {
          const res = await apiFetch('/images/prune', { method: 'POST' });
          await refreshOverview();
          renderHeader();
          renderMainView();
          const freedMb = res.reclaimedMb || dangling.reduce((s, i) => s + i.sizeMb, 0);
          showToast(`Docker Prune: Đã giải phóng ${(freedMb / 1024).toFixed(2)} GB (${freedMb} MB)!`, 'success');
          return;
        } catch (err) {
          // Fallback to local prune
        }
      }

      const freedMb = dangling.reduce((s, i) => s + i.sizeMb, 0);
      state.images = state.images.filter(i => !i.dangling);
      state.vps.diskPct = Math.max(18, state.vps.diskPct - 15);
      renderHeader();
      renderMainView();
      showToast(`Docker Prune: Đã giải phóng ${(freedMb / 1024).toFixed(2)} GB (${freedMb} MB)!`, 'success');
    }

    function removeSingleImage(id) {
      const img = state.images.find(i => i.id === id);
      if (!img) return;
      state.images = state.images.filter(i => i.id !== id);
      state.vps.diskPct = Math.max(18, state.vps.diskPct - 7);
      renderHeader();
      renderMainView();
      showToast(`Đã xóa image ${img.repoTag} (${img.sizeMb} MB)`, 'success');
    }

    async function toggleProxySsl(id) {
      const rt = state.proxyRoutes.find(r => r.id === id);
      if (!rt) return;

      if (canUseBackend()) {
        try {
          const updated = await apiFetch(`/proxy/routes/${encodeURIComponent(id)}/toggle-ssl`, { method: 'POST' });
          await refreshOverview();
          renderWorkspace();
          const isSsl = updated && typeof updated.ssl === 'boolean' ? updated.ssl : !rt.ssl;
          showToast(isSsl ? `Đã bật Auto Let's Encrypt HTTPS cho ${rt.domain}` : `Đã tắt HTTPS cho ${rt.domain}`, isSsl ? 'success' : 'warn');
          return;
        } catch (err) {
          // Graceful local fallback
        }
      }

      rt.ssl = !rt.ssl;
      rt.protocol = rt.ssl ? 'HTTP/2 + TLS 1.3' : 'HTTP Only';
      rt.certExp = rt.ssl ? '90 ngày' : 'Chưa cấp';
      renderWorkspace();
      showToast(rt.ssl ? `Đã bật Auto Let's Encrypt HTTPS cho ${rt.domain}` : `Đã tắt HTTPS cho ${rt.domain}`, rt.ssl ? 'success' : 'warn');
    }

    function toggleRouteSsl(id) {

        root.innerHTML = `
          <div class="${wrapperCls}" onclick="if(event.target===this) closeModal()">
            <div class="w-full ${isMob ? '' : 'max-w-md'} rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-2xl overflow-hidden">
              <div class="px-4 py-3 border-b border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between">
                <span class="text-xs font-semibold text-[var(--foreground)]">1-Click Rollback Container</span>
                <button type="button" onclick="closeModal()" class="text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Đóng</button>
              </div>
              <div class="p-4 space-y-3">
                <div class="text-xs text-[var(--muted-foreground)]">
                  Container: <strong class="font-mono text-[var(--foreground)]">${esc(cnt.name)}</strong><br/>
                  Image hiện tại: <code class="font-mono text-emerald-500">${esc(cnt.image)}</code>
                </div>
                <div class="space-y-1.5">
                  <div class="text-xs font-medium text-[var(--foreground)]">Chọn phiên bản Image ổn định trước đó:</div>
                  ${cnt.previousTags.map(tag => `
                    <button type="button" onclick="executeRollback('${esc(cnt.id)}', '${esc(tag)}')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] hover:border-indigo-500 hover:bg-[var(--accent)] text-xs font-mono text-[var(--foreground)] transition">
                      <span>${esc(tag)}</span>
                      <span class="text-amber-500 font-sans font-semibold">Khôi phục →</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function filterModalLogs(val) {
      state.modal.logFilter = val;
      renderModalLogLines();
    }

    function renderModalLogLines() {
      const box = document.getElementById('modalLogLines');
      if (!box) return;
      const entity = state.modal.targetKind === 'project'
        ? state.projects.find(p => p.id === state.modal.targetId)
        : state.containers.find(c => c.id === state.modal.targetId);
      if (!entity) return;
      const q = state.modal.logFilter.trim().toLowerCase();
      const lines = entity.logs.filter(l => !q || l.toLowerCase().includes(q));
      box.innerHTML = lines.length
        ? lines.map(l => `<div class="leading-relaxed break-all">${highlightTerminalLineHtml(l)}</div>`).join('')
        : '<div class="text-[var(--muted-foreground)]">Không có dòng log nào khớp bộ lọc.</div>';
    }

    function appendLiveLogLine() {
      const entity = state.modal.targetKind === 'project'
        ? state.projects.find(p => p.id === state.modal.targetId)
        : state.containers.find(c => c.id === state.modal.targetId);
      if (!entity) return;
      const ts = new Date().toISOString().slice(11, 19);
      entity.logs.push(`${ts}Z [http] GET /health 200 OK (${Math.floor(Math.random()*5)+1}ms)`);
      renderModalLogLines();
    }

    function executeRollback(containerId, targetTag) {
      return containerAction(containerId, 'rollback', targetTag);
    }

    // =========================================================================
    // 11. BOOTSTRAP
    // =========================================================================
    function renderAll() {
      renderHeader();
      renderWorkspace();
    }

    renderAll();
    initApp();
  </script>
</body>
</html>
