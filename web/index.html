    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }

    function copyMahSnippet(key, btnEl) {
      const text = mahCopyRegistry[key] || '';
      if (!text) return;
      const markCopied = () => {
        if (btnEl) {
          const orig = btnEl.getAttribute('data-orig-label') || btnEl.textContent.trim();
          btnEl.setAttribute('data-orig-label', orig);
          btnEl.innerHTML = '<span class="text-emerald-500 font-semibold">✓ Copied!</span>';
          setTimeout(() => {
            if (btnEl) btnEl.textContent = orig;
          }, 1800);
        }
        showToast('Đã sao chép lệnh / cấu hình MCP!', 'success');
      };
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => {
          fallbackCopyText(text);
          markCopied();
        });
      } else {
        fallbackCopyText(text);
        markCopied();
      }
    }

    function getMahSnapshotSafe() {
      const s = state.mah && state.mah.snapshot ? state.mah.snapshot : {};
      const agents = Array.isArray(s.agents) ? s.agents : [];
      const machines = Array.isArray(s.machines) ? s.machines : [];
      let sessions = Array.isArray(s.sessions) ? s.sessions : [];
      if (!sessions.length && agents.length) {
        const seen = new Set();
        const derived = [];
        agents.forEach(a => {
          (Array.isArray(a.sessions) ? a.sessions : []).forEach(sess => {
            if (sess && sess.id && !seen.has(sess.id)) {
              seen.add(sess.id);
              derived.push(sess);
            }
          });
        });
        sessions = derived;
      }
      return {
        mode: s.mode === 'live' ? 'live' : 'standalone',
        workspaceId: s.workspaceId || 'ws_standalone',
        workspaceName: s.workspaceName || 'Workspace',
        fetchedAt: s.fetchedAt || '',
        apiUrl: s.apiUrl || '',
        fallbackReason: s.fallbackReason || '',
        health: s.health && typeof s.health === 'object'
          ? s.health
          : { status: 'ok', service: 'deploymenthub-mah-go', version: '1.0.0', checks: { postgres: 'up', redis: 'up', nats: 'up' } },
        agents,
        machines,
        sessions,
        messages: Array.isArray(s.messages) ? s.messages : [],
        tasks: Array.isArray(s.tasks) ? s.tasks : [],
        taskEventsByTaskId: s.taskEventsByTaskId && typeof s.taskEventsByTaskId === 'object' ? s.taskEventsByTaskId : {}
      };
    }

    function getMahAgentCaps(agent) {
      if (!agent || !Array.isArray(agent.capabilities)) return [];
      return agent.capabilities
        .map((c, idx) => {
          if (typeof c === 'string') return { id: `cap_${idx}`, capability: c, description: '', metadata: null };
          if (c && typeof c === 'object') return { id: c.id || `cap_${idx}`, capability: c.capability || c.name || '', description: c.description || '', metadata: c.metadata || null };
          return null;
        })
        .filter(c => c && c.capability);
    }

    function formatMahRelativeTime(isoTimestamp, nowMs = Date.now()) {
      if (!isoTimestamp) return '—';
      const targetMs = Date.parse(isoTimestamp);
      if (Number.isNaN(targetMs)) return String(isoTimestamp);
      const diffSec = Math.round((targetMs - nowMs) / 1000);
      const absSec = Math.abs(diffSec);
      let label;
      if (absSec < 60) label = `${absSec}s`;
      else if (absSec < 3600) label = `${Math.floor(absSec / 60)}m ${absSec % 60}s`;
      else if (absSec < 86400) label = `${Math.floor(absSec / 3600)}h ${Math.floor((absSec % 3600) / 60)}m`;
      else label = `${Math.floor(absSec / 86400)}d`;
      return diffSec >= 0 ? `in ${label}` : `${label} ago`;
    }

    function formatMahDurationMs(durationMs) {
      if (durationMs === null || durationMs === undefined || !Number.isFinite(durationMs) || durationMs < 0) return '—';
      if (durationMs < 1000) return `${Math.round(durationMs)}ms`;
      const sec = durationMs / 1000;
      if (sec < 60) return `${sec.toFixed(1)}s`;
      return `${Math.floor(sec / 60)}m ${Math.round(sec % 60)}s`;
    }

    function computeMahSessionLease(session, nowMs = Date.now(), leaseTtlMs = MAH_LEASE_TTL_MS) {
      const gen = session && session.connectionGeneration !== undefined ? session.connectionGeneration : 1;
      const generationBadge = `gen #${gen}`;
      const hbAge = session && session.lastHeartbeatAt
        ? Math.max(0, Math.round((nowMs - Date.parse(session.lastHeartbeatAt)) / 1000))
        : null;

      if (!session || session.connectionStatus === 'DISCONNECTED') {
        return { state: 'disconnected', remainingMs: 0, remainingSeconds: 0, progressPercent: 0, heartbeatAgeSeconds: hbAge, generationBadge, isEligibleForWork: false };
      }
      if (!session.leaseExpiresAt) {
        return { state: 'expired', remainingMs: 0, remainingSeconds: 0, progressPercent: 0, heartbeatAgeSeconds: hbAge, generationBadge, isEligibleForWork: false };
      }
      const remainingMs = Date.parse(session.leaseExpiresAt) - nowMs;
      if (Number.isNaN(remainingMs) || remainingMs <= 0) {
        return { state: 'expired', remainingMs: 0, remainingSeconds: 0, progressPercent: 0, heartbeatAgeSeconds: hbAge, generationBadge, isEligibleForWork: false };
      }
      const remainingSeconds = Math.ceil(remainingMs / 1000);
      const progressPercent = Math.max(0, Math.min(100, Math.round((remainingMs / Math.max(1, leaseTtlMs)) * 100)));
      const stateLabel = (session.connectionStatus === 'SUSPECT' || remainingMs <= MAH_EXPIRING_SOON_MS) ? 'expiring_soon' : 'healthy';
      const isEligibleForWork = session.connectionStatus === 'CONNECTED' && session.executionStatus === 'IDLE' && remainingMs > 0;
      return { state: stateLabel, remainingMs, remainingSeconds, progressPercent, heartbeatAgeSeconds: hbAge, generationBadge, isEligibleForWork };
    }

    function computeMahKpis(snapshot, nowMs = Date.now()) {
      const agents = Array.isArray(snapshot?.agents) ? snapshot.agents : [];
      const machines = Array.isArray(snapshot?.machines) ? snapshot.machines : [];
      const sessions = Array.isArray(snapshot?.sessions) ? snapshot.sessions : [];
      const messages = Array.isArray(snapshot?.messages) ? snapshot.messages : [];
      const tasks = Array.isArray(snapshot?.tasks) ? snapshot.tasks : [];

      let connectedSessions = 0, suspectSessions = 0, disconnectedSessions = 0;
      let idleSessions = 0, busySessions = 0, drainingSessions = 0;
      sessions.forEach(s => {
        const lease = computeMahSessionLease(s, nowMs);
        if (s.connectionStatus === 'CONNECTED' && lease.state !== 'expired') connectedSessions += 1;
        else if (s.connectionStatus === 'SUSPECT' && lease.state !== 'expired') suspectSessions += 1;
        else disconnectedSessions += 1;

        if (s.executionStatus === 'IDLE') idleSessions += 1;
        else if (s.executionStatus === 'BUSY') busySessions += 1;
        else if (s.executionStatus === 'DRAINING') drainingSessions += 1;
      });

      let queuedMessages = 0, deliveredMessages = 0, ackedMessages = 0, failedMessages = 0;
      messages.forEach(m => {
        const st = m.status;
        if (st === 'CREATED' || st === 'QUEUED' || st === 'RETRY_PENDING') queuedMessages += 1;
        else if (st === 'DELIVERED') deliveredMessages += 1;
        else if (st === 'ACKED') ackedMessages += 1;
        else if (st === 'FAILED' || st === 'EXPIRED') failedMessages += 1;
      });

      let pendingTasks = 0, activeTasks = 0, completedTasks = 0, failedTasks = 0;
      tasks.forEach(t => {
        const st = t.status;
        if (st === 'PENDING') pendingTasks += 1;
        else if (st === 'DELIVERED' || st === 'ACCEPTED' || st === 'PROCESSING') activeTasks += 1;
        else if (st === 'COMPLETED') completedTasks += 1;
        else failedTasks += 1;
      });

      return {
        totalAgents: agents.length,
        activeAgents: agents.filter(a => a && a.status === 'ACTIVE').length,
        availableAgents: agents.filter(a => Boolean(a && a.available)).length,
        totalMachines: machines.length,
        totalSessions: sessions.length,
        connectedSessions,
        suspectSessions,
        disconnectedSessions,
        idleSessions,
        busySessions,
        drainingSessions,
        totalMessages: messages.length,
        queuedMessages,
        deliveredMessages,
        ackedMessages,
        failedMessages,
        totalTasks: tasks.length,
        pendingTasks,
        activeTasks,
        completedTasks,
        failedTasks
      };
    }

    function computeMahTaskLifecycle(status) {
      switch (status) {
        case 'PENDING': return { currentStepIndex: 0, isTerminal: false, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
        case 'DELIVERED': return { currentStepIndex: 1, isTerminal: false, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
        case 'ACCEPTED': return { currentStepIndex: 2, isTerminal: false, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
        case 'PROCESSING': return { currentStepIndex: 3, isTerminal: false, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
        case 'COMPLETED': return { currentStepIndex: 4, isTerminal: true, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
        case 'FAILED':
        case 'CANCELLED':
        case 'EXPIRED':
          return { currentStepIndex: 4, isTerminal: true, isFailureTerminal: true, terminalLabel: status };
        default:
          return { currentStepIndex: 0, isTerminal: false, isFailureTerminal: false, terminalLabel: 'COMPLETED' };
      }
    }

    function resolveMahBadgeTone(value) {
      switch (String(value || '')) {
        case 'CONNECTED':
        case 'IDLE':
        case 'ACTIVE':
        case 'ACKED':
        case 'COMPLETED':
        case 'ok':
        case 'up':
        case 'healthy':
        case 'live':
          return 'success';
        case 'CONNECTING':
        case 'STARTING':
        case 'BUSY':
        case 'DELIVERED':
        case 'ACCEPTED':
        case 'PROCESSING':
        case 'HIGH':
        case 'PUSH':
        case 'HYBRID':
          return 'info';
        case 'SUSPECT':
        case 'PAUSED':
        case 'DRAINING':
        case 'CREATED':
        case 'QUEUED':
        case 'PENDING':
        case 'RETRY_PENDING':
        case 'NACKED':
        case 'degraded':
        case 'expiring_soon':
        case 'standalone':
          return 'warning';
        case 'FAILED':
        case 'EXPIRED':
        case 'CANCELLED':
        case 'REVOKED':
        case 'URGENT':
        case 'unhealthy':
        case 'down':
        case 'expired':
          return 'danger';
        default:
          return 'neutral';
      }
    }

    function mahStatusBadgeHtml(label, toneOverride = null, dot = false) {
      const tone = toneOverride || resolveMahBadgeTone(label);
      const toneMap = {
        success: { wrap: 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30', dot: 'bg-emerald-500' },
        info: { wrap: 'bg-sky-500/15 text-sky-500 border-sky-500/30', dot: 'bg-sky-500' },
        warning: { wrap: 'bg-amber-500/15 text-amber-500 border-amber-500/30', dot: 'bg-amber-500' },
        danger: { wrap: 'bg-rose-500/15 text-rose-500 border-rose-500/30', dot: 'bg-rose-500' },
        neutral: { wrap: 'bg-[var(--content)] text-[var(--muted-foreground)] border-[var(--border)]', dot: 'bg-[var(--muted-foreground)]' }
      };
      const t = toneMap[tone] || toneMap.neutral;
      return `<span class="inline-flex items-center gap-1.5 text-[11px] px-2 py-0.5 rounded-full border font-semibold shrink-0 ${t.wrap}">${dot ? `<span class="w-1.5 h-1.5 rounded-full ${t.dot}"></span>` : ''}${esc(label)}</span>`;
    }

    function mahFencingBadgeHtml(generation, prefix = 'gen') {
      if (generation === undefined || generation === null) {
        return `<span class="inline-flex items-center text-[11px] px-2 py-0.5 rounded-md bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] font-mono">—</span>`;
      }
      return `<span title="Monotonically increasing fencing token rejecting stale connections or workers" class="inline-flex items-center text-[11px] px-2 py-0.5 rounded-md bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 font-mono font-medium shrink-0">${esc(prefix)} #${esc(generation)}</span>`;
    }

    function mahLeaseBadgeHtml(lease) {
      if (!lease || lease.state === 'disconnected') return mahStatusBadgeHtml('DISCONNECTED', 'neutral', false);
      if (lease.state === 'expired') return mahStatusBadgeHtml('LEASE EXPIRED', 'danger', true);
      if (lease.state === 'expiring_soon') return mahStatusBadgeHtml(`EXPIRING (${lease.remainingSeconds}s)`, 'warning', true);
      return mahStatusBadgeHtml(`ACTIVE (${lease.remainingSeconds}s)`, 'success', true);
    }

    function isUserTypingInsideMainView() {
      if (typeof document === 'undefined' || !document.activeElement) return false;
      const el = document.activeElement;
      const tag = el.tagName ? el.tagName.toUpperCase() : '';
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
      const main = document.getElementById('mainViewContainer');
      const modal = document.getElementById('modalRoot');
      return Boolean((main && main.contains(el)) || (modal && modal.contains(el)));
    }

    async function fetchMahConfig(opts = {}) {
      if (!canUseBackend()) return null;
      try {
        const cfg = await apiFetch('/mah/config');
        if (cfg && typeof cfg === 'object') {
          state.mah.config = Object.assign({}, state.mah.config, cfg);
          if (!opts.skipRender) renderAll();
        }
        return cfg;
      } catch (err) {
        return null;
      }
    }

    async function refreshMahSnapshot(opts = {}) {
      const m = state.mah;
      m.loading = true;
      if (!opts.skipRender && !opts.silent && state.activeTab === 'mah') {
        renderMainView();
      }
      if (!canUseBackend()) {
        m.loading = false;
        if (!opts.skipRender) renderAll();
        return m.snapshot;
      }
      try {
        const data = await apiFetch('/mah/snapshot');
        if (data && typeof data === 'object') {
          m.snapshot = {
            mode: data.mode === 'live' ? 'live' : 'standalone',
            workspaceId: data.workspaceId || 'ws_standalone',
            workspaceName: data.workspaceName || 'Workspace',
            fetchedAt: data.fetchedAt || new Date().toISOString(),
            apiUrl: data.apiUrl || m.config.apiUrl || '',
            fallbackReason: data.fallbackReason || '',
            health: data.health && typeof data.health === 'object'
              ? data.health
              : { status: 'ok', service: 'deploymenthub-mah-go', version: '1.0.0', checks: { postgres: 'up', redis: 'up', nats: 'up' } },
            agents: Array.isArray(data.agents) ? data.agents : [],
            machines: Array.isArray(data.machines) ? data.machines : [],
            sessions: Array.isArray(data.sessions) ? data.sessions : [],
            messages: Array.isArray(data.messages) ? data.messages : [],
            tasks: Array.isArray(data.tasks) ? data.tasks : [],
            taskEventsByTaskId: data.taskEventsByTaskId && typeof data.taskEventsByTaskId === 'object' ? data.taskEventsByTaskId : {}
          };
          m.lastError = '';
          if (m.snapshot.agents.length && (!m.dispatchTargetAgentId || !m.snapshot.agents.some(a => a.id === m.dispatchTargetAgentId))) {
            m.dispatchTargetAgentId = m.snapshot.agents[0].id;
          }
          if (m.snapshot.agents.length && (!m.selectedAgentId || !m.snapshot.agents.some(a => a.id === m.selectedAgentId))) {
            m.selectedAgentId = m.snapshot.agents[0].id;
          }
          if (m.snapshot.tasks.length && (!m.selectedTaskId || !m.snapshot.tasks.some(t => t.taskId === m.selectedTaskId))) {
            m.selectedTaskId = m.snapshot.tasks[0].taskId;
          }
        }
        if (!opts.silent) {
          showToast(m.snapshot.mode === 'live' ? 'Đã đồng bộ MAH Live Snapshot!' : 'Đã làm mới MAH Snapshot (Standalone)', m.snapshot.mode === 'live' ? 'success' : 'info');
        }
      } catch (err) {
        const msg = err && err.message ? err.message : 'MAH API unreachable';
        m.lastError = msg;
        m.snapshot = Object.assign({}, m.snapshot, {
          mode: 'standalone',
          fallbackReason: msg
        });
        if (!opts.silent) {
          showToast(`Không thể kết nối MAH API (${msg}) — giữ chế độ Standalone`, 'warn');
        }
      } finally {
        m.loading = false;
        if (!opts.skipRender) {
          const modalOpen = Boolean(state.mah.settingsOpen || state.mah.registerAgentOpen || state.modal.open);
          if (opts.silent && (isUserTypingInsideMainView() || modalOpen)) {
            renderHeader();
          } else {
            renderAll();
          }
        }
      }
      return m.snapshot;
    }

    function setMahSubTab(sub) {
      state.mah.subTab = sub;
      renderMainView();
    }

    function toggleMahAutoRefresh(enabled) {
      state.mah.autoRefresh = Boolean(enabled);
      if (mahPollTimer) {
        clearInterval(mahPollTimer);
        mahPollTimer = null;
      }
      if (state.mah.autoRefresh) {
        mahPollTimer = setInterval(() => {
          if (!state.mah.loading) refreshMahSnapshot({ silent: true });
        }, 10000);
        showToast('Đã bật MAH Auto-Poll mỗi 10 giây', 'info');
      } else {
        showToast('Đã tắt MAH Auto-Poll', 'info');
      }
      if (state.activeTab === 'mah') renderMainView();
    }

    function openMahSettingsModal() {
      state.modal.open = false;
      state.mah.registerAgentOpen = false;
      const c = state.mah.config || {};
      state.mah.settingsForm = {
        apiUrl: c.apiUrl || defaultOrigin(),
        apiToken: c.apiToken || '',
        serverHost: c.serverHost || defaultHost(),
        sshUser: c.sshUser || 'root',
        mcpScriptPath: c.mcpScriptPath || 'deploymenthub'
      };
      state.mah.settingsOpen = true;
      renderModal();
    }

    function openMahRegisterModal() {
      state.modal.open = false;
      state.mah.settingsOpen = false;
      state.mah.registerForm = { logicalName: '', description: '', capabilities: '' };
      state.mah.registerAgentOpen = true;
      renderModal();
    }

    function closeMahModals() {
      state.mah.settingsOpen = false;
      state.mah.registerAgentOpen = false;
      renderModal();
    }

    function clearMahConfigToken() {
      if (!state.mah.settingsForm) state.mah.settingsForm = Object.assign({}, state.mah.config);
      state.mah.settingsForm.apiToken = '__CLEAR__';
      const inp = document.getElementById('mahCfgTokenInput');
      if (inp) inp.value = '__CLEAR__';
    }

    async function saveMahConfig(event) {
      if (event && event.preventDefault) event.preventDefault();
      const form = state.mah.settingsForm || state.mah.config;
      const payload = {
        apiUrl: String(form.apiUrl || '').trim() || defaultOrigin(),
        apiToken: String(form.apiToken || '').trim(),
        serverHost: String(form.serverHost || '').trim() || defaultHost(),
        sshUser: String(form.sshUser || '').trim() || 'root',
        mcpScriptPath: String(form.mcpScriptPath || '').trim() || 'deploymenthub'
      };

      if (canUseBackend()) {
        try {
          const updated = await apiFetch('/mah/config', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          if (updated && typeof updated === 'object') {
            state.mah.config = Object.assign({}, state.mah.config, updated);
          }
          state.mah.settingsOpen = false;
          renderModal();
          await refreshMahSnapshot({ silent: true });
          showToast('Đã lưu cấu hình MAH API & đồng bộ Snapshot!', 'success');
          return;
        } catch (err) {
          showToast(`Lỗi lưu cấu hình MAH: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }

      if (payload.apiToken === '__CLEAR__') {
        payload.apiToken = '';
        payload.hasToken = false;
      } else if (payload.apiToken) {
        payload.hasToken = true;
      }
      state.mah.config = Object.assign({}, state.mah.config, payload);
      state.mah.settingsOpen = false;
      renderModal();
      renderAll();
      showToast('Đã lưu cấu hình MAH (Standalone)', 'info');
    }

    async function registerMahAgent(event) {
      if (event && event.preventDefault) event.preventDefault();
      const form = state.mah.registerForm || {};
      const logicalName = String(form.logicalName || '').trim();
      const description = String(form.description || '').trim();
      const capsRaw = String(form.capabilities || '');
      if (!logicalName || !/^[a-zA-Z0-9][a-zA-Z0-9._-]*$/.test(logicalName)) {
        showToast('Logical Name phải bắt đầu bằng chữ/số và chỉ chứa [a-zA-Z0-9._-]', 'warn');
        return;
      }
      const capabilities = capsRaw
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(c => ({ capability: c }));

      const body = { logicalName, description, capabilities };
      if (canUseBackend()) {
        try {
          const created = await apiFetch('/mah/agents', {
            method: 'POST',
            body: JSON.stringify(body)
          });
          state.mah.registerAgentOpen = false;
          if (created && created.id) {
            state.mah.selectedAgentId = created.id;
            state.mah.dispatchTargetAgentId = created.id;
          }
          renderModal();
          await refreshMahSnapshot({ silent: true });
          showToast(`Đã đăng ký Logical Agent "${logicalName}"!`, 'success');
          return;
        } catch (err) {
          showToast(`Đăng ký Agent thất bại: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }

      const nowIso = new Date().toISOString();
      const simId = `agt_sim_${Date.now().toString(36)}`;
      state.mah.snapshot.agents.unshift({
        id: simId,
        workspaceId: state.mah.snapshot.workspaceId || 'ws_standalone',
        logicalName,
        description,
        status: 'ACTIVE',
        capabilities: capabilities.map((c, i) => ({ id: `cap_sim_${Date.now()}_${i}`, capability: c.capability })),
        sessionCount: 0,
        onlineSessionCount: 0,
        available: false,
        sessions: [],
        createdAt: nowIso
      });
      state.mah.selectedAgentId = simId;
      state.mah.dispatchTargetAgentId = simId;
      state.mah.registerAgentOpen = false;
      renderModal();
      renderAll();
      showToast(`Đã đăng ký Agent "${logicalName}" (Standalone)`, 'success');
    }

    function parseDispatchJsonOrObject(rawText, fallbackKey) {
      const trimmed = String(rawText || '').trim();
      if (trimmed.startsWith('{')) {
        try {
          const parsed = JSON.parse(trimmed);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
        } catch {}
      }
      return { [fallbackKey]: trimmed || (fallbackKey === 'text' ? 'Ping from DeploymentHub MAH' : 'Execute delegated task') };
    }

    async function submitMahDispatch(event) {
      if (event && event.preventDefault) event.preventDefault();
      const m = state.mah;
      const snap = getMahSnapshotSafe();
      const targetId = (m.dispatchTargetAgentId || (snap.agents[0] && snap.agents[0].id) || '').trim();
      if (!targetId) {
        showToast('Vui lòng chọn hoặc đăng ký một Target Agent trước khi gửi.', 'warn');
        return;
      }
      const targetAgent = snap.agents.find(a => a.id === targetId);
      const targetName = targetAgent ? targetAgent.logicalName : targetId;

      if (m.dispatchKind === 'message') {
        const body = {
          recipient: {
            scope: 'AGENT',
            agentId: targetId,
            sessionId: null
          },
          type: (m.dispatchMessageType || '').trim() || 'agent.message',
          payload: parseDispatchJsonOrObject(m.dispatchText, 'text'),
          priority: m.dispatchPriority || 'NORMAL',
          deliveryPolicy: m.dispatchDeliveryPolicy || 'STORE_AND_FORWARD',
          fallbackPolicy: 'QUEUE',
          selectionStrategy: 'FIRST_AVAILABLE',
          idempotencyKey: `ui_msg_${Date.now()}`
        };

        if (canUseBackend()) {
          try {
            const res = await apiFetch('/mah/messages', {
              method: 'POST',
              body: JSON.stringify(body)
            });
            if (res && res.messageId) m.selectedMessageId = res.messageId;
            await refreshMahSnapshot({ silent: true });
            showToast(`Đã gửi ${m.dispatchDeliveryPolicy} message tới ${targetName}!`, 'success');
            return;
          } catch (err) {
            showToast(`Gửi message thất bại: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
            return;
          }
        }

        const nowIso = new Date().toISOString();
        const msgId = `msg_sim_${Date.now().toString(36)}`;
        const isOnline = Boolean(targetAgent && targetAgent.available);
        m.snapshot.messages.unshift({
          attemptCount: isOnline ? 1 : 0,
          status: isOnline ? 'DELIVERED' : 'QUEUED',
          deliveryStatus: isOnline ? 'DELIVERED' : 'PENDING',
          envelope: {
            protocolVersion: '1',
            messageId: msgId,
            workspaceId: snap.workspaceId,
            sender: { agentId: 'agt_dashboard_operator', sessionId: null },
            recipient: body.recipient,
            type: body.type,
            payload: body.payload,
            priority: body.priority,
            deliveryPolicy: body.deliveryPolicy,
            fallbackPolicy: 'QUEUE',
            selectionStrategy: 'FIRST_AVAILABLE',
            idempotencyKey: body.idempotencyKey,
            createdAt: nowIso,
            expiresAt: new Date(Date.now() + 86400000).toISOString()
          }
        });
        m.selectedMessageId = msgId;
        renderAll();
        showToast(`Đã enqueue message tới ${targetName} (Standalone)`, 'success');
        return;
      }

      // Delegate Task
      let targetSessionId = null;
      if (m.dispatchSelectionStrategy === 'PINNED') {
        const agentSessions = snap.sessions.filter(s => s.agentId === targetId);
        targetSessionId = (m.dispatchTargetSessionId || (agentSessions[0] && agentSessions[0].id) || '').trim() || null;
        if (!targetSessionId) {
          showToast('Chiến lược PINNED yêu cầu Target Agent có ít nhất 1 Session ID.', 'warn');
          return;
        }
      }

      const taskBody = {
        targetAgentId: targetId,
        requiredCapability: (m.dispatchCapability || '').trim() || null,
        selectionStrategy: m.dispatchSelectionStrategy || 'FIRST_AVAILABLE',
        ...(targetSessionId ? { targetSessionId } : {}),
        priority: m.dispatchPriority || 'NORMAL',
        input: parseDispatchJsonOrObject(m.dispatchText, 'objective'),
        idempotencyKey: `ui_tsk_${Date.now()}`
      };

      if (canUseBackend()) {
        try {
          const created = await apiFetch('/mah/tasks', {
            method: 'POST',
            body: JSON.stringify(taskBody)
          });
          if (created && created.taskId) m.selectedTaskId = created.taskId;
          await refreshMahSnapshot({ silent: true });
          showToast(`Đã ủy nhiệm Task tới ${targetName} (${taskBody.selectionStrategy})!`, 'success');
          return;
        } catch (err) {
          showToast(`Ủy nhiệm Task thất bại: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }

      const nowIso = new Date().toISOString();
      const taskId = `tsk_sim_${Date.now().toString(36)}`;
      const eligibleSess = snap.sessions.find(s => s.agentId === targetId && s.connectionStatus === 'CONNECTED' && s.executionStatus === 'IDLE');
      const simTask = {
        protocolVersion: '1',
        taskId,
        workspaceId: snap.workspaceId,
        requester: { agentId: 'agt_dashboard_operator', sessionId: null },
        target: {
          agentId: targetId,
          capability: taskBody.requiredCapability,
          sessionId: targetSessionId,
          selectionStrategy: taskBody.selectionStrategy
        },
        assignedSessionId: targetSessionId || (eligibleSess ? eligibleSess.id : null),
        attemptId: eligibleSess ? `att_${Date.now().toString(36)}` : null,
        attemptNumber: 1,
        assignmentGeneration: 1,
        status: eligibleSess ? 'DELIVERED' : 'PENDING',
        priority: taskBody.priority,
        input: taskBody.input,
        result: null,
        error: null,
        idempotencyKey: taskBody.idempotencyKey,
        createdAt: nowIso,
        startedAt: null,
        completedAt: null
      };
      m.snapshot.tasks.unshift(simTask);
      m.snapshot.taskEventsByTaskId[taskId] = [
        { id: `tevt_${Date.now()}_1`, taskId, eventType: 'TASK_CREATED', payload: { selectionStrategy: taskBody.selectionStrategy, capability: taskBody.requiredCapability }, createdAt: nowIso }
      ];
      m.selectedTaskId = taskId;
      renderAll();
      showToast(`Đã ủy nhiệm Task tới ${targetName} (Standalone)`, 'success');
    }

    async function deleteMahMessage(messageId, ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (!messageId) return;
      if (canUseBackend()) {
        try {
          await apiFetch(`/mah/messages/${encodeURIComponent(messageId)}`, { method: 'DELETE' });
          await refreshMahSnapshot({ silent: true });
          showToast(`Đã xóa message ${messageId}`, 'success');
          return;
        } catch (err) {
          showToast(`Không thể xóa message: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }
      state.mah.snapshot.messages = state.mah.snapshot.messages.filter(m => (m.envelope?.messageId || m.messageId) !== messageId);
      renderAll();
      showToast(`Đã xóa message ${messageId}`, 'success');
    }

    async function unregisterMahSession(sessionId) {
      if (!sessionId) return;
      if (canUseBackend()) {
        try {
          await apiFetch(`/mah/sessions/${encodeURIComponent(sessionId)}`, { method: 'DELETE' });
          await refreshMahSnapshot({ silent: true });
          showToast(`Đã unregister session ${sessionId}`, 'success');
          return;
        } catch (err) {
          showToast(`Không thể unregister session: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }
      state.mah.snapshot.sessions = state.mah.snapshot.sessions.filter(s => s.id !== sessionId);
      state.mah.snapshot.agents = state.mah.snapshot.agents.map(a => Object.assign({}, a, {
        sessions: Array.isArray(a.sessions) ? a.sessions.filter(s => s.id !== sessionId) : []
      }));
      renderAll();
      showToast(`Đã unregister session ${sessionId}`, 'success');
    }

    async function cancelMahTask(taskId) {
      if (!taskId) return;
      if (canUseBackend()) {
        try {
          await apiFetch(`/mah/tasks/${encodeURIComponent(taskId)}/cancel`, {
            method: 'POST',
            body: JSON.stringify({ reason: 'Cancelled from DeploymentHub MAH UI' })
          });
          await refreshMahSnapshot({ silent: true });
          showToast(`Đã hủy task ${taskId}`, 'warn');
          return;
        } catch (err) {
          showToast(`Không thể hủy task: ${err && err.message ? err.message : 'Unknown error'}`, 'error');
          return;
        }
      }
      const task = state.mah.snapshot.tasks.find(t => t.taskId === taskId);
      if (task) {
        task.status = 'CANCELLED';
        task.completedAt = new Date().toISOString();
      }
      renderAll();
      showToast(`Đã hủy task ${taskId} (Standalone)`, 'warn');

                      <select onchange="onMahTargetAgentChange(this.value)" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                        ${snap.agents.map(a => `<option value="${esc(a.id)}" ${selectedTargetId === a.id ? 'selected' : ''}>${esc(a.logicalName)} (${a.available ? 'online' : 'offline — queues'})</option>`).join('')}
                      </select>
                    ` : `
                      <div class="flex gap-1.5">
                        <input type="text" value="${esc(m.dispatchTargetAgentId)}" oninput="state.mah.dispatchTargetAgentId = this.value" placeholder="agt_target_id" class="flex-1 px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
                        <button type="button" onclick="openMahRegisterModal()" class="px-2.5 py-2 rounded-xl bg-[var(--secondary)] border border-[var(--border)] text-xs font-medium text-[var(--foreground)] shrink-0">+ Agent</button>
                      </div>
                    `}
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Priority</label>
                    <select onchange="state.mah.dispatchPriority = this.value" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                      ${['LOW', 'NORMAL', 'HIGH', 'URGENT'].map(p => `<option value="${p}" ${m.dispatchPriority === p ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                  </div>
                </div>

                ${m.dispatchKind === 'message' ? `
                  <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-2'} gap-2.5">
                    <div>
                      <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Message Type</label>
                      <input type="text" value="${esc(m.dispatchMessageType)}" oninput="state.mah.dispatchMessageType = this.value" placeholder="agent.message" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Delivery Policy</label>
                      <select onchange="state.mah.dispatchDeliveryPolicy = this.value" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                        ${['STORE_AND_FORWARD', 'PREFER_ONLINE', 'ONLINE_ONLY'].map(dp => `<option value="${dp}" ${m.dispatchDeliveryPolicy === dp ? 'selected' : ''}>${dp}</option>`).join('')}
                      </select>
                    </div>
                  </div>
                ` : `
                  <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-2'} gap-2.5">
                    <div>
                      <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Required Capability</label>
                      <input type="text" value="${esc(m.dispatchCapability)}" oninput="state.mah.dispatchCapability = this.value" placeholder="code_review" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Selection Strategy</label>
                      <select onchange="onMahSelectionStrategyChange(this.value)" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                        ${['FIRST_AVAILABLE', 'ROUND_ROBIN', 'PINNED', 'LEAST_BUSY'].map(st => `<option value="${st}" ${m.dispatchSelectionStrategy === st ? 'selected' : ''}>${st}</option>`).join('')}
                      </select>
                    </div>
                  </div>
                  ${m.dispatchSelectionStrategy === 'PINNED' ? `
                    <div>
                      <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">Pinned Target Session ID</label>
                      ${targetSessions.length ? `
                        <select onchange="state.mah.dispatchTargetSessionId = this.value" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]">
                          ${targetSessions.map(s => `<option value="${esc(s.id)}" ${(m.dispatchTargetSessionId || targetSessions[0].id) === s.id ? 'selected' : ''}>${esc(s.id)} (${esc(s.connectionStatus)} / ${esc(s.executionStatus)})</option>`).join('')}
                        </select>
                      ` : `
                        <input type="text" value="${esc(m.dispatchTargetSessionId)}" oninput="state.mah.dispatchTargetSessionId = this.value" placeholder="sess_..." class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />
                      `}
                    </div>
                  ` : ''}
                `}

                <div>
                  <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">${m.dispatchKind === 'message' ? 'Envelope Payload Text (hoặc JSON)' : 'Task Objective (hoặc JSON)'}</label>
                  <textarea rows="2" oninput="state.mah.dispatchText = this.value" placeholder="${m.dispatchKind === 'message' ? 'Please review the updated fencing token check...' : 'Run verification and report status...'}" class="w-full px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)] placeholder:text-[var(--muted-foreground)]">${esc(m.dispatchText)}</textarea>
                </div>

                <div class="flex items-center justify-between gap-2">
                  <button type="submit" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white text-xs font-semibold shadow-sm shadow-indigo-500/25 hover:opacity-95 transition">
                    ${m.dispatchKind === 'message' ? 'Publish Message Envelope' : 'Delegate Task'}
                  </button>
                  <span class="text-xs text-[var(--muted-foreground)] font-mono">${snap.agents.length} agent(s)</span>
                </div>
              </form>
            </section>
          </div>

          <!-- Recent Message Envelopes & Delegated Task Pipeline -->
          <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-2'} gap-4">
            <section class="rounded-2xl border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-sm">
              <div class="px-4 py-3 border-b border-[var(--border)] flex items-center justify-between">
                <h3 class="text-xs font-semibold text-[var(--foreground)]">Recent Message Envelopes</h3>
                <button type="button" onclick="setMahSubTab('messages')" class="text-xs font-medium text-indigo-400 hover:underline">Inspect Queue →</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">
                      <th class="py-2.5 px-3 font-semibold">Message</th>
                      <th class="py-2.5 px-3 font-semibold">Route</th>
                      <th class="py-2.5 px-3 font-semibold">Status</th>
                      <th class="py-2.5 px-3 font-semibold text-right">Age</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[var(--border)]">
                    ${snap.messages.length === 0 ? `
                      <tr><td colspan="4" class="py-8 text-center text-[var(--muted-foreground)]">Chưa có message nào trong inbox.</td></tr>
                    ` : snap.messages.slice(0, 5).map(item => {
                      const env = item.envelope || item;
                      const senderId = env.sender?.agentId || 'unknown';
                      const recipId = env.recipient?.agentId || 'unknown';
                      return `
                        <tr class="hover:bg-[var(--content)]/60">
                          <td class="py-2.5 px-3">
                            <div class="font-mono text-[var(--foreground)] truncate max-w-[140px]">${esc(env.messageId || '—')}</div>
                            <div class="text-[11px] text-[var(--muted-foreground)]">${esc(env.type || 'agent.message')}</div>
                          </td>
                          <td class="py-2.5 px-3">
                            <span class="text-[var(--muted-foreground)]">${esc(agentNameById.get(senderId) || senderId)}</span> → <strong class="text-[var(--foreground)]">${esc(agentNameById.get(recipId) || recipId)}</strong>
                          </td>
                          <td class="py-2.5 px-3">${mahStatusBadgeHtml(item.status || 'QUEUED')}</td>
                          <td class="py-2.5 px-3 text-right text-[var(--muted-foreground)] font-mono">${esc(formatMahRelativeTime(env.createdAt, nowMs))}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </section>

            <section class="rounded-2xl border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-sm">
              <div class="px-4 py-3 border-b border-[var(--border)] flex items-center justify-between">
                <h3 class="text-xs font-semibold text-[var(--foreground)]">Delegated Task Pipeline</h3>
                <button type="button" onclick="setMahSubTab('tasks')" class="text-xs font-medium text-indigo-400 hover:underline">View Timelines →</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">
                      <th class="py-2.5 px-3 font-semibold">Task ID</th>
                      <th class="py-2.5 px-3 font-semibold">Target Agent</th>
                      <th class="py-2.5 px-3 font-semibold">Fencing</th>
                      <th class="py-2.5 px-3 font-semibold text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[var(--border)]">
                    ${snap.tasks.length === 0 ? `
                      <tr><td colspan="4" class="py-8 text-center text-[var(--muted-foreground)]">Chưa có task nào được ủy nhiệm.</td></tr>
                    ` : snap.tasks.slice(0, 5).map(task => {
                      const targetId = task.target?.agentId || 'unknown';
                      return `
                        <tr class="hover:bg-[var(--content)]/60">
                          <td class="py-2.5 px-3">
                            <div class="font-mono text-[var(--foreground)] truncate max-w-[140px]">${esc(task.taskId || '—')}</div>
                            <div class="text-[11px] text-[var(--muted-foreground)]">${esc(task.target?.capability || 'default')} · ${esc(task.priority || 'NORMAL')}</div>
                          </td>
                          <td class="py-2.5 px-3">
                            <strong class="text-[var(--foreground)]">${esc(agentNameById.get(targetId) || targetId)}</strong>
                            ${task.assignedSessionId ? `<div class="text-[11px] font-mono text-[var(--muted-foreground)] truncate max-w-[130px]">${esc(task.assignedSessionId)}</div>` : ''}
                          </td>
                          <td class="py-2.5 px-3">${mahFencingBadgeHtml(task.assignmentGeneration, 'assign')}</td>
                          <td class="py-2.5 px-3 text-right">${mahStatusBadgeHtml(task.status || 'PENDING')}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // Sub-tab 2: Agent Directory
    // -------------------------------------------------------------------------
    function getFilteredMahAgents(snap) {
      const m = state.mah;
      const q = (m.agentQuery || '').trim().toLowerCase();
      const cap = (m.agentCapability || '').trim();
      return snap.agents.filter(agent => {
        if (m.agentAvailableOnly && !agent.available) return false;
        if (m.agentStatusFilter && m.agentStatusFilter !== 'ALL' && agent.status !== m.agentStatusFilter) return false;
        const caps = getMahAgentCaps(agent);
        if (cap && !caps.some(c => c.capability === cap)) return false;
        if (q) {
          const matchName = String(agent.logicalName || '').toLowerCase().includes(q);
          const matchId = String(agent.id || '').toLowerCase().includes(q);
          const matchDesc = String(agent.description || '').toLowerCase().includes(q);
          const matchCap = caps.some(c => c.capability.toLowerCase().includes(q));
          if (!matchName && !matchId && !matchDesc && !matchCap) return false;
        }
        return true;
      });
    }

    function renderMahAgents(snap, nowMs, isMob) {
      const m = state.mah;
      const capMap = new Map();
      snap.agents.forEach(agent => {
        const seen = new Set();
        getMahAgentCaps(agent).forEach(c => {
          if (!seen.has(c.capability)) {
            seen.add(c.capability);
            capMap.set(c.capability, (capMap.get(c.capability) || 0) + 1);
          }
        });
      });
      const capList = Array.from(capMap.entries())
        .map(([capability, agentCount]) => ({ capability, agentCount }))
        .sort((a, b) => a.capability.localeCompare(b.capability));

      return `
        <div class="space-y-4">
          <!-- Filter Bar -->
          <div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-3.5 space-y-2.5 shadow-sm">
            <div class="flex flex-wrap items-center gap-2.5">
              <div class="relative flex-1 min-w-[220px]">
                <input type="search" value="${esc(m.agentQuery)}" oninput="onMahAgentSearch(this.value)" placeholder="Search logicalName, agentId, description, or capability..." class="w-full pl-8 pr-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)] placeholder:text-[var(--muted-foreground)] focus:outline-none focus:border-indigo-500" />
                <svg class="w-3.5 h-3.5 text-[var(--muted-foreground)] absolute left-2.5 top-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </div>

              <select onchange="setMahAgentStatusFilter(this.value)" aria-label="Filter by agent status" class="px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                ${['ALL', 'ACTIVE', 'DISABLED', 'ARCHIVED'].map(st => `<option value="${st}" ${m.agentStatusFilter === st ? 'selected' : ''}>${st === 'ALL' ? 'All Statuses' : st}</option>`).join('')}
              </select>

              <label class="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)] cursor-pointer select-none">
                <input type="checkbox" ${m.agentAvailableOnly ? 'checked' : ''} onchange="toggleMahAgentAvailableOnly(this.checked)" class="rounded cursor-pointer" />
                <span>Available Only (Connected + Idle)</span>
              </label>
            </div>

            ${capList.length > 0 ? `
              <div class="flex flex-wrap items-center gap-1.5">
                <button type="button" onclick="toggleMahAgentCapability('')" class="px-2.5 py-1 rounded-full text-xs font-medium transition ${m.agentCapability === '' ? 'bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white' : 'bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
                  All Capabilities (${snap.agents.length})
                </button>
                ${capList.map(c => `
                  <button type="button" onclick="toggleMahAgentCapability(${escJsArg(c.capability)})" class="px-2.5 py-1 rounded-full text-xs font-mono font-medium transition ${m.agentCapability === c.capability ? 'bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white' : 'bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
                    ${esc(c.capability)} (${c.agentCount})
                  </button>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div id="mahAgentsMasterDetail">${renderMahAgentsMasterDetail(snap, nowMs, isMob)}</div>
        </div>
      `;
    }

    function renderMahAgentsMasterDetail(snap, nowMs, isMob) {
      const filtered = getFilteredMahAgents(snap);
      const activeAgent = filtered.find(a => a.id === state.mah.selectedAgentId) || filtered[0] || null;
      const activeCaps = activeAgent ? getMahAgentCaps(activeAgent) : [];
      const activeSessions = activeAgent ? (Array.isArray(activeAgent.sessions) ? activeAgent.sessions : snap.sessions.filter(s => s.agentId === activeAgent.id)) : [];

      return `
        <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-12'} gap-4">
          <!-- Left List -->
          <section class="${isMob ? '' : 'lg:col-span-5'} rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-semibold text-[var(--foreground)]">Agent Directory (${filtered.length})</h2>
              <button type="button" onclick="openMahRegisterModal()" class="text-xs text-indigo-400 hover:underline font-medium">+ Đăng ký</button>
            </div>

            ${filtered.length === 0 ? `
              <div class="rounded-xl border border-dashed border-[var(--border)] bg-[var(--content)] p-6 text-center text-xs text-[var(--muted-foreground)] space-y-2">
                <div>No logical agents match the current discovery filters.</div>
                ${snap.agents.length === 0 ? `<button type="button" onclick="openMahRegisterModal()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-indigo-500 to-sky-500 text-white font-semibold">+ Đăng ký Agent đầu tiên</button>` : ''}
              </div>
            ` : `
              <div class="space-y-2 max-h-[600px] overflow-y-auto thin-scroll pr-1">
                ${filtered.map(agent => {
                  const isSel = activeAgent && activeAgent.id === agent.id;
                  const caps = getMahAgentCaps(agent);
                  const sessList = Array.isArray(agent.sessions) ? agent.sessions : snap.sessions.filter(s => s.agentId === agent.id);
                  const onlineCnt = agent.onlineSessionCount !== undefined ? agent.onlineSessionCount : sessList.filter(s => s.connectionStatus === 'CONNECTED').length;
                  const totalCnt = agent.sessionCount !== undefined ? agent.sessionCount : sessList.length;
                  return `
                    <button type="button" onclick="selectMahAgent(${escJsArg(agent.id)})" class="w-full text-left rounded-xl border p-3 space-y-2 transition ${isSel ? 'border-indigo-500 bg-gradient-to-br from-indigo-500/15 to-sky-500/5 ring-2 ring-indigo-500/20' : 'border-[var(--border)] bg-[var(--content)] hover:border-indigo-500/40'}">
                      <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                          <span class="w-2 h-2 rounded-full shrink-0 ${agent.available ? 'bg-emerald-500 pulse-dot' : 'bg-[var(--muted-foreground)]'}" title="${agent.available ? 'Eligible session available' : 'No connected idle session'}"></span>
                          <strong class="text-xs font-semibold text-[var(--foreground)] truncate">${esc(agent.logicalName)}</strong>
                        </div>
                        ${mahStatusBadgeHtml(agent.status || 'ACTIVE')}
                      </div>
                      <div class="text-[11px] font-mono text-[var(--muted-foreground)] truncate">${esc(agent.id)}</div>
                      ${agent.description ? `<p class="text-xs text-[var(--muted-foreground)] line-clamp-2">${esc(agent.description)}</p>` : ''}
                      <div class="flex flex-wrap items-center justify-between gap-1.5 pt-1">
                        <div class="flex flex-wrap items-center gap-1">
                          ${caps.map(c => `<span class="text-[11px] px-1.5 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] font-mono text-[var(--foreground)]">${esc(c.capability)}</span>`).join('')}
                        </div>
                        <span class="text-[11px] font-mono text-[var(--muted-foreground)]">${onlineCnt}/${totalCnt} online</span>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <!-- Right Detail -->
          <section class="${isMob ? '' : 'lg:col-span-7'} rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 space-y-4 shadow-sm">
            ${!activeAgent ? `
              <div class="py-16 text-center text-xs text-[var(--muted-foreground)]">Select an agent to inspect its capabilities and runtime sessions.</div>
            ` : `
              <div class="flex flex-wrap items-start justify-between gap-2 pb-3 border-b border-[var(--border)]">
                <div>
                  <h2 class="text-sm font-semibold text-[var(--foreground)]">${esc(activeAgent.logicalName)}</h2>
                  <p class="text-xs font-mono text-[var(--muted-foreground)] mt-0.5">${esc(activeAgent.id)} · workspace ${esc(activeAgent.workspaceId || snap.workspaceId)}</p>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${mahStatusBadgeHtml(activeAgent.available ? 'AVAILABLE' : 'UNAVAILABLE', activeAgent.available ? 'success' : 'warning', true)}
                  ${mahStatusBadgeHtml(activeAgent.status || 'ACTIVE')}
                </div>
              </div>

              ${activeAgent.description ? `<p class="text-xs text-[var(--foreground)] leading-relaxed">${esc(activeAgent.description)}</p>` : ''}

              <div class="space-y-2">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Declared Capabilities (${activeCaps.length})</h3>
                ${activeCaps.length === 0 ? `<div class="text-xs text-[var(--muted-foreground)]">No capabilities declared.</div>` : `
                  <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-2'} gap-2.5">
                    ${activeCaps.map(cap => `
                      <div class="rounded-xl border border-[var(--border)] bg-[var(--content)] p-3 space-y-1.5">
                        <div class="flex items-center justify-between gap-2">
                          <code class="text-xs px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-400 border border-indigo-500/30 font-mono font-semibold">${esc(cap.capability)}</code>
                          <span class="text-[11px] font-mono text-[var(--muted-foreground)] truncate">${esc(cap.id)}</span>
                        </div>
                        ${cap.description ? `<p class="text-xs text-[var(--muted-foreground)]">${esc(cap.description)}</p>` : ''}
                        ${cap.metadata && Object.keys(cap.metadata).length ? `<pre class="p-2 rounded-lg bg-[var(--sidebar)] border border-[var(--border)] text-[11px] font-mono text-[var(--foreground)] overflow-x-auto">${esc(JSON.stringify(cap.metadata, null, 2))}</pre>` : ''}
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <div class="space-y-2">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-[var(--muted-foreground)]">Runtime Sessions (${activeSessions.length})</h3>
                ${activeSessions.length === 0 ? `
                  <div class="rounded-xl border border-dashed border-[var(--border)] bg-[var(--content)] p-4 text-center text-xs text-[var(--muted-foreground)]">No runtime sessions registered for this agent.</div>
                ` : `
                  <div class="overflow-x-auto rounded-xl border border-[var(--border)]">
                    <table class="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">
                          <th class="py-2 px-3 font-semibold">Session / Machine</th>
                          <th class="py-2 px-2 font-semibold">Connection</th>
                          <th class="py-2 px-2 font-semibold">Execution</th>
                          <th class="py-2 px-2 font-semibold">Mode</th>
                          <th class="py-2 px-2 font-semibold">Fencing</th>
                          <th class="py-2 px-3 font-semibold">Lease</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-[var(--border)]">
                        ${activeSessions.map(sess => {
                          const lease = computeMahSessionLease(sess, nowMs);
                          return `
                            <tr class="hover:bg-[var(--content)]/60">
                              <td class="py-2.5 px-3">
                                <div class="font-mono text-[var(--foreground)]">${esc(sess.id)}</div>
                                <div class="text-[11px] font-mono text-[var(--muted-foreground)]">host: ${esc(sess.machineId || '—')} · hb ${esc(formatMahRelativeTime(sess.lastHeartbeatAt, nowMs))}</div>
                              </td>
                              <td class="py-2.5 px-2">${mahStatusBadgeHtml(sess.connectionStatus || 'DISCONNECTED', null, true)}</td>
                              <td class="py-2.5 px-2">${mahStatusBadgeHtml(sess.executionStatus || 'IDLE')}</td>
                              <td class="py-2.5 px-2"><span class="px-1.5 py-0.5 rounded bg-[var(--content)] border border-[var(--border)] font-mono text-[11px]">${esc(sess.deliveryMode || 'HYBRID')}</span></td>
                              <td class="py-2.5 px-2">${mahFencingBadgeHtml(sess.connectionGeneration)}</td>
                              <td class="py-2.5 px-3">${mahLeaseBadgeHtml(lease)}</td>
                            </tr>
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                `}
              </div>
            `}
          </section>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // Sub-tab 3: Machines & Sessions
    // -------------------------------------------------------------------------
    function renderMahSessions(snap, nowMs, isMob) {

                        ${meta.os ? `<span class="text-[11px] px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] font-mono">${esc(meta.os)}/${esc(meta.arch || 'x64')}</span>` : ''}
                        ${meta.region ? `<span class="text-[11px] px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] font-mono">${esc(meta.region)}</span>` : ''}

            <div class="px-4 py-3 border-b border-[var(--border)]">
              <h2 class="text-sm font-semibold text-[var(--foreground)]">Session Lifecycle, Heartbeats &amp; Lease Fencing (${snap.sessions.length})</h2>
              <p class="text-xs text-[var(--muted-foreground)]">Connection state is independent from execution state; stale <code class="font-mono text-[var(--foreground)]">connectionGeneration</code> tokens are rejected (A08–A10)</p>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-[var(--muted-foreground)]">

                    <th class="py-2.5 px-3 font-semibold">Logical Agent</th>
                    <th class="py-2.5 px-3 font-semibold">Host Machine</th>
                    <th class="py-2.5 px-2 font-semibold">Connection</th>
                    <th class="py-2.5 px-2 font-semibold">Execution</th>
                    <th class="py-2.5 px-2 font-semibold">Mode</th>
                    <th class="py-2.5 px-2 font-semibold">Fencing</th>
                    <th class="py-2.5 px-2 font-semibold">Last Heartbeat</th>

                    const barColor = lease.state === 'healthy' ? 'bg-emerald-500' : lease.state === 'expiring_soon' ? 'bg-amber-500' : lease.state === 'expired' ? 'bg-rose-500' : 'bg-[var(--muted-foreground)]';

                          <strong class="text-[var(--foreground)]">${esc(agentNameById.get(sess.agentId) || sess.agentId)}</strong>

                            </div>

                        <td class="py-2.5 px-3 text-right">
                          <button type="button" onclick="unregisterMahSession(${escJsArg(sess.id)})" class="px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-500 border border-rose-500/30 hover:bg-rose-500/25 text-xs font-medium">Unregister</button>

              </table>
            </div>

        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // Sub-tab 4: Message Queue
    // -------------------------------------------------------------------------
    function getFilteredMahMessages(snap) {
      const m = state.mah;
      const q = (m.messageQuery || '').trim().toLowerCase();
      const agentNameById = new Map(snap.agents.map(a => [a.id, a.logicalName]));
      return snap.messages.filter(item => {
        const env = item.envelope || item;
        if (m.messageStatusFilter !== 'ALL' && item.status !== m.messageStatusFilter) return false;
        if (m.messagePolicyFilter !== 'ALL' && env.deliveryPolicy !== m.messagePolicyFilter) return false;
        if (q) {
          const senderId = String(env.sender?.agentId || '').toLowerCase();
          const recipId = String(env.recipient?.agentId || '').toLowerCase();
          const senderName = String(agentNameById.get(env.sender?.agentId) || '').toLowerCase();
          const recipName = String(agentNameById.get(env.recipient?.agentId) || '').toLowerCase();
          const match =
            String(env.messageId || '').toLowerCase().includes(q) ||
            String(env.type || '').toLowerCase().includes(q) ||
            String(env.correlationId || '').toLowerCase().includes(q) ||
            senderId.includes(q) ||
            recipId.includes(q) ||
            senderName.includes(q) ||
            recipName.includes(q);
          if (!match) return false;
        }
        return true;
      });
    }

    function renderMahMessages(snap, nowMs, isMob) {
      const m = state.mah;
      return `
        <div class="space-y-4">
          <div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] p-3.5 flex flex-wrap items-center gap-2.5 shadow-sm">
            <div class="relative flex-1 min-w-[220px]">
              <input type="search" value="${esc(m.messageQuery)}" oninput="onMahMessageSearch(this.value)" placeholder="Filter by messageId, correlationId, type, sender, or recipient..." class="w-full pl-8 pr-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)] placeholder:text-[var(--muted-foreground)] focus:outline-none focus:border-indigo-500" />
              <svg class="w-3.5 h-3.5 text-[var(--muted-foreground)] absolute left-2.5 top-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>

            <select onchange="setMahMessageStatusFilter(this.value)" aria-label="Filter by message status" class="px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
              ${['ALL', 'CREATED', 'QUEUED', 'DELIVERED', 'ACKED', 'RETRY_PENDING', 'FAILED', 'EXPIRED'].map(st => `<option value="${st}" ${m.messageStatusFilter === st ? 'selected' : ''}>${st === 'ALL' ? 'All Lifecycle States' : st}</option>`).join('')}
            </select>

            <select onchange="setMahMessagePolicyFilter(this.value)" aria-label="Filter by delivery policy" class="px-3 py-2 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
              ${['ALL', 'STORE_AND_FORWARD', 'PREFER_ONLINE', 'ONLINE_ONLY'].map(dp => `<option value="${dp}" ${m.messagePolicyFilter === dp ? 'selected' : ''}>${dp === 'ALL' ? 'All Delivery Policies' : dp}</option>`).join('')}
            </select>
          </div>

          <div id="mahMessagesMasterDetail">${renderMahMessagesMasterDetail(snap, nowMs, isMob)}</div>
        </div>
      `;
    }

      return `
        <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-12'} gap-4">

                  return `
                    <div role="button" tabindex="0" onclick="selectMahMessage(${escJsArg(msgId)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectMahMessage(${escJsArg(msgId)});}" class="w-full text-left rounded-xl border p-3 space-y-1.5 cursor-pointer transition ${isSel ? 'border-indigo-500 bg-gradient-to-br from-indigo-500/15 to-sky-500/5 ring-2 ring-indigo-500/20' : 'border-[var(--border)] bg-[var(--content)] hover:border-indigo-500/40'}">
                      <div class="flex items-center justify-between gap-2">
                        <code class="text-xs font-mono text-[var(--foreground)] truncate">${esc(msgId)}</code>
                        <div class="flex items-center gap-1.5 shrink-0">

                        </div>
                      </div>
                      <div class="text-xs flex flex-wrap items-center gap-1.5">
                        <span class="text-[var(--muted-foreground)]">${esc(agentNameById.get(senderId) || senderId)}</span>
                        <span class="text-[var(--muted-foreground)]">→</span>
                        <strong class="text-[var(--foreground)]">${esc(agentNameById.get(recipId) || recipId)}</strong>

                      </div>
                      <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)]">
                        <span class="font-mono truncate">${esc(env.type || 'agent.message')} · ${esc(env.deliveryPolicy || 'STORE_AND_FORWARD')}</span>
                        <span class="shrink-0 font-mono">attempts: ${esc(item.attemptCount ?? 0)} · ${esc(formatMahRelativeTime(env.createdAt, nowMs))}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <!-- Right Detail -->
          <section class="${isMob ? '' : 'lg:col-span-7'} rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 space-y-4 shadow-sm">
            ${!activeItem || !activeEnv ? `
              <div class="py-16 text-center text-xs text-[var(--muted-foreground)]">Select a message envelope to inspect delivery metadata and JSON payload.</div>
            ` : `
              <div class="flex flex-wrap items-start justify-between gap-2 pb-3 border-b border-[var(--border)]">

                  <h2 class="text-sm font-semibold font-mono text-[var(--foreground)]">${esc(activeEnv.messageId)}</h2>
                  <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Type <code class="font-mono text-[var(--foreground)]">${esc(activeEnv.type || 'agent.message')}</code> · Protocol v${esc(activeEnv.protocolVersion || '1')}</p>
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${mahStatusBadgeHtml(activeEnv.priority || 'NORMAL')}
                  ${mahStatusBadgeHtml(activeItem.status || 'QUEUED', null, true)}
                  <button type="button" onclick="deleteMahMessage(${escJsArg(activeEnv.messageId)}, event)" class="px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-500 border border-rose-500/30 hover:bg-rose-500/25 text-xs font-medium">Delete</button>

                  <div class="font-mono text-[var(--foreground)]">${esc(activeEnv.sender?.agentId || '—')}</div>
                  ${activeEnv.sender?.sessionId ? `<div class="text-[11px] font-mono text-[var(--muted-foreground)]">session: ${esc(activeEnv.sender.sessionId)}</div>` : ''}
                </div>
                <div class="rounded-xl border border-[var(--border)] bg-[var(--content)] p-3 space-y-0.5">
                  <div class="text-[11px] uppercase tracking-wider text-[var(--muted-foreground)] font-semibold">Recipient (${esc(activeEnv.recipient?.scope || 'AGENT')})</div>

                  <div class="font-mono text-[var(--foreground)] break-all">${esc(activeEnv.correlationId || '—')}</div>

      `;

    // -------------------------------------------------------------------------
    // Sub-tab 5: Task Timeline
    // -------------------------------------------------------------------------
    function renderMahTasks(snap, nowMs, isMob) {
      const agentNameById = new Map(snap.agents.map(a => [a.id, a.logicalName]));
      const activeTask = snap.tasks.find(t => t.taskId === state.mah.selectedTaskId) || snap.tasks[0] || null;
      const lifecycle = activeTask ? computeMahTaskLifecycle(activeTask.status) : null;
      const rawEvents = activeTask ? (snap.taskEventsByTaskId[activeTask.taskId] || []) : [];
      const orderedEvents = [...rawEvents].sort((a, b) => {
        const diff = Date.parse(a.createdAt || '') - Date.parse(b.createdAt || '');
        return diff !== 0 ? diff : String(a.id || '').localeCompare(String(b.id || ''));
      });

      let durationMs = null;
      if (activeTask && activeTask.startedAt) {
        const start = Date.parse(activeTask.startedAt);
        const end = activeTask.completedAt ? Date.parse(activeTask.completedAt) : nowMs;
        durationMs = end - start;
      }

      return `
        <div class="grid ${isMob ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-12'} gap-4">
          <!-- Left Task Cards -->
          <section class="${isMob ? '' : 'lg:col-span-5'} rounded-2xl border border-[var(--border)] bg-[var(--card)] p-4 space-y-3 shadow-sm">
            <h2 class="text-sm font-semibold text-[var(--foreground)]">Delegated Tasks (${snap.tasks.length})</h2>
            ${snap.tasks.length === 0 ? `
              <div class="rounded-xl border border-dashed border-[var(--border)] bg-[var(--content)] p-6 text-center text-xs text-[var(--muted-foreground)]">No delegated tasks recorded yet.</div>
            ` : `
              <div class="space-y-2 max-h-[640px] overflow-y-auto thin-scroll pr-1">
                ${snap.tasks.map(task => {
                  const isSel = activeTask && activeTask.taskId === task.taskId;
                  const reqId = task.requester?.agentId || 'unknown';
                  const tgtId = task.target?.agentId || 'unknown';
                  return `
                    <button type="button" onclick="selectMahTask(${escJsArg(task.taskId)})" class="w-full text-left rounded-xl border p-3 space-y-1.5 transition ${isSel ? 'border-indigo-500 bg-gradient-to-br from-indigo-500/15 to-sky-500/5 ring-2 ring-indigo-500/20' : 'border-[var(--border)] bg-[var(--content)] hover:border-indigo-500/40'}">
                      <div class="flex items-center justify-between gap-2">
                        <code class="text-xs font-mono text-[var(--foreground)] truncate">${esc(task.taskId)}</code>
                        ${mahStatusBadgeHtml(task.status || 'PENDING', null, true)}
                      </div>
                      <div class="text-xs">
                        <span class="text-[var(--muted-foreground)]">${esc(agentNameById.get(reqId) || reqId)}</span>
                        <span class="text-[var(--muted-foreground)]"> → </span>
                        <strong class="text-[var(--foreground)]">${esc(agentNameById.get(tgtId) || tgtId)}</strong>
