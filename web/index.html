                        <span class="truncate text-[var(--foreground)]">${esc(ac.name)} <span class="text-emerald-400">${esc(ac.ipv4 || '')}</span></span>
                        ${!isProtectedContainer({ name: ac.name }) ? `<button type="button" ${busy ? 'disabled' : ''} onclick="disconnectContainerNetwork('${esc(n.id)}', '${esc(ac.id)}', '${esc(ac.name)}')" class="text-rose-400 hover:underline shrink-0">Detach</button>` : ''}
                      </div>
                    `).join('')}
                  </div>

                  ${n.driver !== 'host' && n.driver !== 'null' ? `
                    <div class="flex items-center gap-1.5 pt-2 border-t border-[var(--border)]">
                      <select onchange="state.docker.connectNet['${esc(n.id)}'] = this.value" class="flex-1 px-2.5 py-1 rounded-lg bg-[var(--content)] border border-[var(--border)] text-xs font-mono">
                        <option value="">Chọn container để attach...</option>
                        ${cntOpts.map(c => `<option value="${esc(c.id)}" ${attachVal === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
                      </select>
                      <button type="button" ${busy ? 'disabled' : ''} onclick="connectContainerNetwork('${esc(n.id)}')" class="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-xs font-semibold hover:bg-emerald-500/25 shrink-0">+ Attach</button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderDockerEventRowsHtml() {
      const f = state.docker.eventFilter || 'all';
      const raw = Array.isArray(state.docker.events) ? state.docker.events : [];
      const list = raw.filter(ev => f === 'all' || ev.type === f).slice().reverse();
      if (!list.length) {
        return '<div class="p-8 text-center text-xs text-[var(--muted-foreground)]">Chưa có sự kiện Docker Engine nào khớp bộ lọc.</div>';
      }
      return list.map(ev => {
        const act = String(ev.action || '').toLowerCase();
        const badgeCls = /die|kill|destroy|delete|oom|stop/.test(act)
          ? 'bg-rose-500/15 text-rose-400 border-rose-500/30'
          : /start|create|unpause|pull|connect/.test(act)
          ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30'
          : 'bg-sky-500/15 text-sky-400 border-sky-500/30';
        return `
          <div class="px-3 py-2 flex flex-wrap items-center justify-between gap-2 font-mono text-[11px]">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-1.5 py-0.5 rounded border text-[10px] uppercase font-semibold ${badgeCls}">${esc(ev.type)}:${esc(ev.action)}</span>
              <span class="font-semibold text-[var(--foreground)] truncate">${esc(ev.actorName || ev.actorId)}</span>
              <span class="text-[var(--muted-foreground)] truncate">(${esc(ev.actorId)})</span>
            </div>
            <span class="text-[var(--muted-foreground)] shrink-0">${esc(ev.timestamp)}</span>
          </div>
        `;
      }).join('');
    }

    function renderLiveEventsSection() {
      const filters = ['all', 'container', 'image', 'volume', 'network'];
      return `
        <div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-sm">
          <div class="p-3 border-b border-[var(--border)] bg-[var(--sidebar)] flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span id="dockerEventsLiveStatus" class="text-xs font-mono ${state.docker.eventsConnected ? 'text-emerald-400' : 'text-amber-400'}">${state.docker.eventsConnected ? '● Live Events SSE' : '○ Connecting SSE...'}</span>
              <span class="text-[11px] text-[var(--muted-foreground)]">(${(state.docker.events || []).length} events)</span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              ${filters.map(ft => `
                <button type="button" onclick="state.docker.eventFilter='${ft}'; renderMainView();" class="px-2.5 py-1 rounded-lg text-xs font-medium capitalize ${state.docker.eventFilter === ft ? 'bg-indigo-500 text-white' : 'bg-[var(--content)] text-[var(--muted-foreground)] border border-[var(--border)]'}">${esc(ft)}</button>
              `).join('')}
              <button type="button" onclick="refreshDockerEvents({silent:false})" class="px-2.5 py-1 rounded-lg bg-[var(--secondary)] text-xs font-medium border border-[var(--border)]">↻ Tải lại</button>
            </div>
          </div>
          <div id="dockerEventsFeedHost" class="divide-y divide-[var(--border)] max-h-[420px] overflow-y-auto thin-scroll">
            ${renderDockerEventRowsHtml()}
          </div>
        </div>
      `;
    }

    function renderDocker(container) {
      const isMob = state.viewport === 'mobile';
      const danglingList = state.images.filter(i => i.dangling);
      const reclaimableMb = danglingList.reduce((acc, i) => acc + i.sizeMb, 0);
      const subTabs = [
        { k: 'containers', label: `Containers (${state.containers.length})` },
        { k: 'images', label: `Images & Cache (${state.images.length})` },
        { k: 'volumes', label: `Volumes (${(state.docker.volumes || []).length})` },
        { k: 'networks', label: `Networks (${(state.docker.networks || []).length})` },
        { k: 'events', label: `Live Events` }
      ];

      let bodyHtml = '';
      if (state.dockerSubTab === 'images') bodyHtml = renderImagesSection(isMob, danglingList, reclaimableMb);
      else if (state.dockerSubTab === 'volumes') bodyHtml = renderVolumesSection(isMob);
      else if (state.dockerSubTab === 'networks') bodyHtml = renderNetworksSection(isMob);
      else if (state.dockerSubTab === 'events') bodyHtml = renderLiveEventsSection();
      else bodyHtml = renderContainersSection(isMob);

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="w-9 h-9 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-500 flex items-center justify-center shrink-0">${dockerIconSvg('w-5 h-5')}</span>
              <div>
                <h1 class="text-base font-semibold text-[var(--foreground)]">Quản lý Docker Runtime</h1>
                <p class="text-xs text-[var(--muted-foreground)]">Containers, Images &amp; Cache, Volumes + Backup, Networks &amp; Realtime Events SSE.</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-1 p-1 rounded-xl bg-[var(--card)] border border-[var(--border)]">
              ${subTabs.map(st => `
                <button type="button" onclick="setDockerSubTab('${st.k}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition ${state.dockerSubTab === st.k ? 'bg-gradient-to-r from-indigo-500 via-violet-500 to-sky-500 text-white shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">${esc(st.label)}</button>
              `).join('')}
            </div>
          </div>

          ${renderDockerDiskUsageBanner(isMob)}
          ${bodyHtml}
        </div>
      `;
    }

    function renderContainersSection(isMob) {
      const busy = state.docker && state.docker.busyKey;
      if (isMob) {
        if (!state.containers.length) {
          return `
            <div class="rounded-2xl border border-dashed border-[var(--border)] bg-[var(--card)] p-8 text-center text-xs text-[var(--muted-foreground)]">
              Chưa có container nào đang chạy. Các container sẽ xuất hiện khi bạn triển khai project.
            </div>
          `;
        }
        return `
          <div class="space-y-2.5">
            ${state.containers.map(c => {
              const lim = Math.max(1, c.ramLimitMb || 512);
              const ramPct = Math.min(100, Math.round((c.ramMb / lim) * 100));
              const isRunning = c.status === 'Running';
              const isPaused = c.status === 'Paused';
              const isProt = isProtectedContainer(c);
              const live = state.docker?.liveStats?.[c.id];
              return `
                <div class="rounded-2xl border ${isProt ? 'border-indigo-500/30 bg-indigo-500/5' : 'border-[var(--border)] bg-[var(--card)]'} p-3.5 space-y-2.5 shadow-sm">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      ${stackIconHtml(c.stackKey || 'nextjs', 'sm')}
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <span class="text-xs font-semibold font-mono text-[var(--foreground)] truncate">${esc(c.name)}</span>
                          ${isProt ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-400 border border-indigo-500/30 font-semibold shrink-0">🛡️ System</span>' : ''}
                        </div>
                        <div class="text-xs font-mono text-[var(--muted-foreground)] truncate">${esc(c.image)}</div>
                      </div>
                    </div>
                    ${statusBadgeHtml(c.status)}
                  </div>

                  <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-2">
                      <div class="flex justify-between text-[var(--muted-foreground)]"><span>CPU</span><span class="font-mono text-[var(--foreground)]">${c.cpuPct}%</span></div>
                      <div class="mt-1 h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
                        <div class="h-full bg-sky-500 rounded-full" style="width:${Math.min(100, c.cpuPct * 3)}%"></div>
                      </div>
                    </div>
                    <div class="bg-[var(--content)] border border-[var(--border)] rounded-xl p-2">
                      <div class="flex justify-between text-[var(--muted-foreground)]"><span>RAM</span><span class="font-mono text-[var(--foreground)]">${live ? live.memoryUsedMb : c.ramMb}MB</span></div>
                      <div class="mt-1 h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 rounded-full" style="width:${ramPct}%"></div>
                      </div>
                    </div>
                  </div>

                  <div class="text-xs font-mono text-[var(--muted-foreground)] truncate">Ports: ${esc(c.ports)}</div>

                  <div class="flex flex-wrap gap-1.5 pt-1">
                    ${!isProt ? `<button type="button" ${busy ? 'disabled' : ''} onclick="toggleContainerPower('${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium ${isRunning ? 'bg-rose-500/15 text-rose-500 border border-rose-500/30' : 'bg-emerald-500/15 text-emerald-500 border border-emerald-500/30'}">${isRunning ? 'Stop' : 'Start'}</button>` : ''}
                    ${!isProt && (isRunning || isPaused) ? `<button type="button" ${busy ? 'disabled' : ''} onclick="containerAction('${esc(c.id)}', '${isPaused ? 'unpause' : 'pause'}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-amber-500/15 text-amber-400 border border-amber-500/30">${isPaused ? 'Unpause' : 'Pause'}</button>` : ''}
                    ${!isProt || canRestartProtectedContainer(c) ? `<button type="button" ${busy ? 'disabled' : ''} onclick="restartContainer('${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)]">Restart</button>` : ''}
                    <button type="button" onclick="openInspectModal('${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-500/15 text-indigo-400 border border-indigo-500/30">Inspect</button>
                    <button type="button" onclick="openLogsModal('container', '${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-[var(--content)] text-[var(--foreground)] border border-[var(--border)]">Logs</button>
                    ${!isProt ? `<button type="button" onclick="openRollbackModal('${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-amber-500/15 text-amber-500 border border-amber-500/30">Rollback</button>` : ''}
                    ${!isProt ? `<button type="button" ${busy ? 'disabled' : ''} onclick="confirmRemoveContainer('${esc(c.id)}')" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-rose-500/15 text-rose-400 border border-rose-500/30">Xóa</button>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return `
        <div class="rounded-2xl border border-[var(--border)] bg-[var(--card)] overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-[var(--border)] bg-[var(--sidebar)] text-xs text-[var(--muted-foreground)]">
                  <th class="py-3 px-4 font-semibold">Container / Image</th>
                  <th class="py-3 px-3 font-semibold">Trạng thái</th>
                  <th class="py-3 px-3 font-semibold">CPU</th>
                  <th class="py-3 px-3 font-semibold">RAM</th>
                  <th class="py-3 px-3 font-semibold">Ports</th>
                  <th class="py-3 px-4 font-semibold text-right">Hành động</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[var(--border)] text-xs">
                ${state.containers.length === 0 ? `
                  <tr>
                    <td colspan="6" class="py-12 text-center text-xs text-[var(--muted-foreground)]">
                      Chưa có container nào đang chạy. Hãy bắt đầu deploy ứng dụng từ tab Deploy.
                    </td>
                  </tr>
                ` : state.containers.map(c => {
                  const isRunning = c.status === 'Running';
                  const isPaused = c.status === 'Paused';
                  const isProt = isProtectedContainer(c);
                  const live = state.docker?.liveStats?.[c.id];
                  const lim = Math.max(1, c.ramLimitMb || (live && live.memoryLimitMb) || 512);
                  const ramVal = live ? Math.round(live.memoryUsedMb) : c.ramMb;
                  const ramPct = Math.min(100, Math.round((ramVal / lim) * 100));
                  return `
                    <tr class="hover:bg-[var(--content)]/60 transition ${isProt ? 'bg-indigo-500/[0.03]' : ''}">
                      <td class="py-3 px-4">
                        <div class="flex items-center gap-2.5">
                          ${stackIconHtml(c.stackKey || 'nextjs', 'sm')}
                          <div>
                            <div class="flex items-center gap-1.5">
                              <span class="font-semibold font-mono text-[var(--foreground)]">${esc(c.name)}</span>
                              ${isProt ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-400 border border-indigo-500/30 font-semibold">🛡️ System</span>' : ''}
                            </div>
                            <div class="text-xs font-mono text-[var(--muted-foreground)]">${esc(c.image)} • ${esc(c.uptime)}</div>
                          </div>
                        </div>
                      </td>
                      <td class="py-3 px-3">${statusBadgeHtml(c.status)}</td>
                      <td class="py-3 px-3 w-28">
                        <div class="flex justify-between font-mono text-xs mb-1"><span>${c.cpuPct}%</span></div>
                        <div class="h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
                          <div class="h-full bg-sky-500 rounded-full" style="width:${Math.min(100, c.cpuPct * 3)}%"></div>
                        </div>
                      </td>
                      <td class="py-3 px-3 w-36">
                        <div class="flex justify-between font-mono text-xs mb-1"><span>${ramVal} / ${Math.round(lim)} MB</span></div>
                        <div class="h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
                          <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 rounded-full" style="width:${ramPct}%"></div>
                        </div>
                      </td>
                      <td class="py-3 px-3 font-mono text-[var(--muted-foreground)] max-w-[190px] truncate" title="${esc(c.ports)}">${esc(c.ports)}</td>
                      <td class="py-3 px-4 text-right">
                        <div class="inline-flex flex-wrap items-center justify-end gap-1">
                          ${!isProt ? `<button type="button" ${busy ? 'disabled' : ''} onclick="toggleContainerPower('${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium ${isRunning ? 'bg-rose-500/15 text-rose-500 border border-rose-500/30 hover:bg-rose-500/25' : 'bg-emerald-500/15 text-emerald-500 border border-emerald-500/30 hover:bg-emerald-500/25'}">${isRunning ? 'Stop' : 'Start'}</button>` : ''}
                          ${!isProt && (isRunning || isPaused) ? `<button type="button" ${busy ? 'disabled' : ''} onclick="containerAction('${esc(c.id)}', '${isPaused ? 'unpause' : 'pause'}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-amber-500/15 text-amber-400 border border-amber-500/30 hover:bg-amber-500/25">${isPaused ? 'Unpause' : 'Pause'}</button>` : ''}
                          ${!isProt || canRestartProtectedContainer(c) ? `<button type="button" ${busy ? 'disabled' : ''} onclick="restartContainer('${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] hover:bg-[var(--accent)]">Restart</button>` : ''}
                          <button type="button" onclick="openInspectModal('${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-indigo-500/15 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-500/25">Inspect</button>
                          <button type="button" onclick="openLogsModal('container', '${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-[var(--content)] text-[var(--foreground)] border border-[var(--border)] hover:bg-[var(--accent)]">Logs</button>
                          ${!isProt ? `<button type="button" onclick="openRollbackModal('${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-amber-500/15 text-amber-500 border border-amber-500/30 hover:bg-amber-500/25">Rollback</button>` : ''}
                          ${!isProt ? `<button type="button" ${busy ? 'disabled' : ''} onclick="confirmRemoveContainer('${esc(c.id)}')" class="px-2 py-1 rounded-lg text-xs font-medium bg-rose-500/15 text-rose-400 border border-rose-500/30 hover:bg-rose-500/25">Xóa</button>` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderImagesSection(isMob, danglingList, reclaimableMb) {
      const totalMb = state.images.reduce((acc, i) => acc + i.sizeMb, 0);
      const unusedList = state.images.filter(i => !i.inUse);
      const busy = state.docker && state.docker.busyKey;
      return `
        <div class="space-y-3">
          <!-- Prune Summary Bar -->
          <div class="rounded-2xl border border-indigo-500/25 bg-gradient-to-br from-indigo-500/10 via-sky-500/5 to-transparent p-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <div class="space-y-0.5">
              <div class="text-xs font-semibold text-[var(--foreground)]">Tổng dung lượng Images: <span class="font-mono text-indigo-500">${(totalMb / 1024).toFixed(2)} GB</span> (${state.images.length} images)</div>
              <div class="text-xs text-[var(--muted-foreground)]">
                ${danglingList.length ? `Phát hiện <strong class="text-amber-500">${danglingList.length} image rác (&lt;none&gt;)</strong> chiếm <strong class="font-mono">${reclaimableMb} MB</strong>.` : 'Hệ thống sạch sẽ, không còn dangling image rác.'}
                ${unusedList.length > danglingList.length ? ` • Có <strong class="font-mono text-sky-400">${unusedList.length}</strong> image chưa dùng.` : ''}
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" ${danglingList.length === 0 || busy ? 'disabled' : ''} onclick="pruneDanglingImages(false)" class="px-3 py-2 rounded-xl text-xs font-semibold transition ${danglingList.length ? 'bg-amber-500/15 text-amber-500 border border-amber-500/40 ring-2 ring-amber-500/15 hover:bg-amber-500/25' : 'bg-[var(--content)] text-[var(--muted-foreground)] border border-[var(--border)] opacity-60'}">
                ${busy === 'prune-dangling' ? 'Đang dọn...' : 'Dọn Image rác (Dangling)'}
              </button>
              <button type="button" ${unusedList.length === 0 || busy ? 'disabled' : ''} onclick="pruneDanglingImages(true)" class="px-3 py-2 rounded-xl text-xs font-semibold transition ${unusedList.length ? 'bg-rose-500/15 text-rose-400 border border-rose-500/35 hover:bg-rose-500/25' : 'bg-[var(--content)] text-[var(--muted-foreground)] border border-[var(--border)] opacity-60'}">
                ${busy === 'prune-all' ? 'Đang dọn...' : 'Dọn tất cả Unused Images'}
              </button>
            </div>
          </div>

          <!-- Image Cards -->
          <div class="grid ${isMob ? 'grid-cols-1 gap-2.5' : 'grid-cols-1 md:grid-cols-2 gap-3'}">
            ${state.images.length === 0 ? `
              <div class="col-span-full rounded-2xl border border-dashed border-[var(--border)] bg-[var(--card)] p-8 text-center text-xs text-[var(--muted-foreground)]">
                Chưa có Docker image nào được lưu trữ.
              </div>
            ` : state.images.map(img => `
              <div class="rounded-2xl border ${img.dangling ? 'border-amber-500/35 bg-amber-500/5' : 'border-[var(--border)] bg-[var(--card)]'} p-3.5 flex flex-col justify-between gap-2.5 shadow-sm">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2.5 min-w-0">
                    ${stackIconHtml(img.stackKey || 'auto', 'sm')}
                    <div class="min-w-0">
                      <div class="text-xs font-semibold font-mono text-[var(--foreground)] truncate">${esc(img.repoTag)}</div>
                      <div class="text-xs text-[var(--muted-foreground)] mt-0.5">${img.note ? esc(img.note) : `ID ${esc(img.id)} • Tạo ${esc(img.created)}`}</div>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <span class="text-xs px-2 py-0.5 rounded-lg bg-[var(--content)] border border-[var(--border)] font-mono text-[var(--foreground)]">${img.sizeMb} MB</span>
                    ${img.inUse
                      ? `<span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500 border border-emerald-500/30 font-medium">In Use</span>`
                      : `<span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-500 border border-amber-500/30 font-medium">${img.dangling ? 'Dangling' : 'Unused'}</span>`
                    }
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-[var(--border)]">
                  <div class="flex flex-wrap items-center gap-1 text-xs">
                    <span class="text-[var(--muted-foreground)]">Tags:</span>
                    ${(img.history || []).map(t => `<span class="px-1.5 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] font-mono">${esc(t)}</span>`).join('')}
                  </div>
                  <div class="flex items-center gap-2.5 shrink-0">
                    <button type="button" onclick="openImageHistoryModal('${esc(img.id)}', '${esc(img.repoTag)}')" class="text-xs text-indigo-400 hover:underline font-medium">History Layers</button>

    function applyLocalContainerAction(id, action, targetTag = '') {
      const idx = state.containers.findIndex(item => item.id === id);
      if (idx < 0) return;
      const c = state.containers[idx];
      if (action === 'stop' || action === 'kill') {
        c.status = 'Stopped';
        c.cpuPct = 0;
        c.ramMb = 0;
        c.uptime = action === 'kill' ? 'Killed vừa xong' : 'Stopped vừa xong';
        c.logs.push(`[docker] Container ${action}ped by user`);
        showToast(`Đã ${action} container ${c.name}`, 'warn');
      } else if (action === 'pause') {
        c.status = 'Paused';
        c.cpuPct = 0;
        c.uptime = 'Paused';
        c.logs.push('[docker] Container paused');
        showToast(`Đã tạm dừng container ${c.name}`, 'warn');
      } else if (action === 'unpause') {
        c.status = 'Running';
        c.uptime = 'Up (Unpaused)';
        c.logs.push('[docker] Container unpaused');
        showToast(`Đã tiếp tục container ${c.name}`, 'success');
      } else if (action === 'remove') {
        state.containers.splice(idx, 1);
        syncVpsRamFromContainers();
        renderHeader();
        renderMainView();
        showToast(`Đã xóa container ${c.name}`, 'success');
        return;
      } else if (action === 'start') {
        c.status = 'Running';
        c.cpuPct = 2.4;
        c.ramMb = Math.min(c.ramLimitMb, 64);
        c.uptime = 'Up vừa xong';
        c.logs.push('[docker] Container started & passing healthcheck');
        showToast(`Đã bật container ${c.name}`, 'success');
      } else if (action === 'restart') {
        c.status = 'Restarting...';
        renderMainView();
        setTimeout(() => {
          c.status = 'Running';
          c.cpuPct = Number((Math.random() * 4 + 1.5).toFixed(1));
          if (c.ramMb === 0) c.ramMb = 48;
          c.uptime = 'Up vừa restart';
          c.logs.push('[docker] Container restarted cleanly');
          syncVpsRamFromContainers();
          renderHeader();
          if (state.activeTab === 'docker') renderMainView();
          showToast(`Restart ${c.name} hoàn tất!`, 'success');
        }, 850);
        return;
      } else if (action === 'rollback' && targetTag) {
        const oldTag = c.image;
        c.image = targetTag;
        if (!c.previousTags.includes(oldTag)) c.previousTags.unshift(oldTag);
        c.status = 'Running';
        c.uptime = 'Up (Rollback vừa xong)';
        c.logs.push(`[rollback] Switched image ${oldTag} -> ${targetTag} (zero-downtime)`);
        closeModal();
        showToast(`Đã rollback ${c.name} về ${targetTag}!`, 'success');
      }

      const siblingCnts = state.containers.filter(x => x.project === c.project);
      const anyRunning = siblingCnts.some(x => x.status === 'Running');
      const proj = state.projects.find(p => p.name === c.project);
      if (proj) {
        proj.status = anyRunning ? 'Running' : 'Stopped';
        proj.ramMb = siblingCnts.reduce((s, x) => s + x.ramMb, 0);
        proj.cpu = Number(siblingCnts.reduce((s, x) => s + x.cpuPct, 0).toFixed(1));
      }
      syncVpsRamFromContainers();
      renderHeader();
      renderMainView();
    }

    async function containerAction(id, action, targetTag = '', removeVolumes = false) {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;
      if (state.docker.busyKey) return;

      if (canUseBackend()) {
        state.docker.busyKey = `cnt:${id}:${action}`;
        if (state.activeTab === 'docker') renderMainView();
        try {
          await apiFetch(`/containers/${encodeURIComponent(id)}/action`, {
            method: 'POST',
            timeoutMs: 30000,
            body: JSON.stringify({ action, targetTag, removeVolumes })
          });
          if (action === 'rollback') closeModal();
          await refreshOverview();
          await refreshDockerDiskUsage({ silent: true, skipRender: true });
          const msgMap = {
            stop: `Đã dừng container ${c.name}`,
            start: `Đã bật container ${c.name}`,
            pause: `Đã tạm dừng ${c.name}`,
            unpause: `Đã tiếp tục ${c.name}`,
            kill: `Đã kill container ${c.name}`,
            remove: `Đã xóa container ${c.name}`,
            restart: `Restart ${c.name} hoàn tất!`,
            rollback: `Đã rollback ${c.name} về ${targetTag}!`
          };
          showToast(msgMap[action] || `Thao tác ${action} hoàn tất`, (action === 'stop' || action === 'pause' || action === 'kill') ? 'warn' : 'success');
        } catch (err) {
          showToast(err && err.message ? err.message : `Lỗi ${action} container`, 'error');
        } finally {
          state.docker.busyKey = '';
          renderAll();
        }
        return;
      }

      applyLocalContainerAction(id, action, targetTag);
    }

    function confirmRemoveContainer(id) {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;
      if (typeof confirm === 'function' && !confirm(`Xác nhận xóa vĩnh viễn container "${c.name}"?`)) {
        return;
      }
      return containerAction(id, 'remove', '', false);
    }

    function toggleContainerPower(id) {
      const c = state.containers.find(item => item.id === id);
      if (!c) return;
      return containerAction(id, c.status === 'Running' ? 'stop' : 'start');
    }

    function restartContainer(id) {
      return containerAction(id, 'restart');
    }

    async function pruneDanglingImages(all = false) {
      const targets = all ? state.images.filter(i => !i.inUse) : state.images.filter(i => i.dangling);
      if (!targets.length || state.docker.busyKey) return;
      if (all && typeof confirm === 'function' && !confirm(`Xác nhận xóa toàn bộ ${targets.length} Docker image chưa gắn container (Unused Images)?`)) {
        return;
      }

      if (canUseBackend()) {
        state.docker.busyKey = all ? 'prune-all' : 'prune-dangling';
        if (state.activeTab === 'docker') renderMainView();
        try {
          const res = await apiFetch('/images/prune', {
            method: 'POST',
            timeoutMs: 30000,
            body: JSON.stringify({ all: Boolean(all) })
          });
          await refreshOverview();
          await refreshDockerDiskUsage({ silent: true, skipRender: true });
          const freedMb = res.reclaimedMb || 0;
          showToast(`Docker Prune: Đã dọn ${res.removedCount || 0} image, giải phóng ${(freedMb / 1024).toFixed(2)} GB (${freedMb} MB)!`, 'success');
        } catch (err) {
          showToast(err && err.message ? err.message : 'Prune image thất bại', 'error');
        } finally {
          state.docker.busyKey = '';
          renderHeader();
          renderMainView();
        }
        return;
      }

      const freedMb = targets.reduce((s, i) => s + i.sizeMb, 0);
      state.images = state.images.filter(i => all ? i.inUse : !i.dangling);
      state.vps.diskPct = Math.max(18, state.vps.diskPct - 15);
      renderHeader();
      renderMainView();
      showToast(`Docker Prune: Đã giải phóng ${(freedMb / 1024).toFixed(2)} GB (${freedMb} MB)!`, 'success');
    }

    async function pruneBuildCache(all = false) {
      if (state.docker.busyKey) return;
      if (typeof confirm === 'function' && !confirm('Xác nhận dọn dẹp Docker Build Cache? Layer cache không dùng sẽ bị xóa để giải phóng dung lượng ổ cứng.')) {
        return;
      }
      if (!canUseBackend()) return;
      state.docker.busyKey = 'cache-prune';
      if (state.activeTab === 'docker') renderMainView();
      try {
        const res = await apiFetch('/build-cache/prune', {
          method: 'POST',
          timeoutMs: 30000,
          body: JSON.stringify({ all: Boolean(all) })
        });
        await refreshDockerDiskUsage({ silent: true, skipRender: true });
        showToast(`Đã dọn Build Cache (${res.cachesDeleted || 0} entries, giải phóng ${fmtBytes(res.spaceReclaimedBytes || 0)})!`, 'success');
      } catch (err) {
        showToast(err && err.message ? err.message : 'Dọn Build Cache thất bại', 'error');
      } finally {
        state.docker.busyKey = '';
        if (state.activeTab === 'docker') renderMainView();
      }
    }

    async function removeSingleImage(id) {
      const img = state.images.find(i => i.id === id);
      if (!img || state.docker.busyKey) return;
      if (typeof confirm === 'function' && !confirm(`Xóa image ${img.repoTag} (${img.sizeMb} MB)?`)) {
        return;
      }
      if (canUseBackend()) {
        state.docker.busyKey = `img:${id}`;
        if (state.activeTab === 'docker') renderMainView();
        try {
          await apiFetch(`/images/${encodeURIComponent(id)}`, { method: 'DELETE', timeoutMs: 20000 });
          await refreshOverview();
          await refreshDockerDiskUsage({ silent: true, skipRender: true });
          showToast(`Đã xóa image ${img.repoTag} (${img.sizeMb} MB)`, 'success');
        } catch (err) {
          showToast(err && err.message ? err.message : `Không thể xóa image ${img.repoTag}`, 'error');
        } finally {
          state.docker.busyKey = '';
          renderHeader();
          renderMainView();
        }
        return;
      }
      state.images = state.images.filter(i => i.id !== id);
      state.vps.diskPct = Math.max(18, state.vps.diskPct - 7);
      renderHeader();
      renderMainView();
      showToast(`Đã xóa image ${img.repoTag} (${img.sizeMb} MB)`, 'success');
    }

                </div>
                <div>
                  <label class="block text-xs text-[var(--muted-foreground)] mb-1">SSH User &amp; Port</label>
                  <input type="text" value="${esc(v.sshUser)}:${esc(v.sshPort)}" readonly class="w-full px-2.5 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-mono text-[var(--foreground)]" />

              </div>

              <div>
                <label class="block text-xs text-[var(--muted-foreground)] mb-1">Chế độ Docker Engine</label>
                <select onchange="state.vps.connMode = this.value; state.vps.socketEndpoint = this.value === 'socket-proxy' ? 'tcp://docker-proxy:2375' : this.value === 'ssh-tunnel' ? ('ssh://' + (state.vps.sshUser || 'deploy') + '@' + ((state.vps.ip && state.vps.ip !== '127.0.0.1') ? state.vps.ip : defaultHost())) : '/var/run/docker.sock'; renderMainView();" class="w-full px-2.5 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--foreground)]">
                  <option value="socket-proxy" ${v.connMode === 'socket-proxy' ? 'selected' : ''}>Docker Socket Proxy (Bảo mật khuyến nghị)</option>
                  <option value="ssh-tunnel" ${v.connMode === 'ssh-tunnel' ? 'selected' : ''}>Remote VPS qua SSH Tunnel (ED25519)</option>
                  <option value="local-sock" ${v.connMode === 'local-sock' ? 'selected' : ''}>Local /var/run/docker.sock</option>
                </select>

              <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                <code class="text-xs font-mono text-[var(--muted-foreground)] truncate">${esc(v.socketEndpoint)}</code>

                  <button type="button" onclick="testVpsConnection()" class="px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] text-xs font-medium">Test Kết nối</button>

                </div>
              </div>
            </div>
          </div>
        </div>
      `;

    async function toggleProxySsl(id) {
      const rt = state.proxyRoutes.find(r => r.id === id);
      if (!rt) return;

      if (canUseBackend()) {
        try {
          const updated = await apiFetch(`/proxy/routes/${encodeURIComponent(id)}/toggle-ssl`, { method: 'POST' });
          await refreshOverview();
          renderWorkspace();
          const isSsl = updated && typeof updated.ssl === 'boolean' ? updated.ssl : !rt.ssl;
          showToast(isSsl ? `Đã bật Auto Let's Encrypt HTTPS cho ${rt.domain}` : `Đã tắt HTTPS cho ${rt.domain}`, isSsl ? 'success' : 'warn');
          return;
        } catch (err) {
          // Graceful local fallback
        }
      }

      rt.ssl = !rt.ssl;
      rt.protocol = rt.ssl ? 'HTTP/2 + TLS 1.3' : 'HTTP Only';
      rt.certExp = rt.ssl ? '90 ngày' : 'Chưa cấp';
      renderWorkspace();
      showToast(rt.ssl ? `Đã bật Auto Let's Encrypt HTTPS cho ${rt.domain}` : `Đã tắt HTTPS cho ${rt.domain}`, rt.ssl ? 'success' : 'warn');
    }

    function toggleRouteSsl(id) {
      return toggleProxySsl(id);
    }

    function copyWebhookUrl() {
      if (navigator.clipboard) navigator.clipboard.writeText(state.webhookUrl).catch(() => {});
      showToast('Đã sao chép Webhook Auto-Deploy URL!', 'success');
    }

    function regenWebhook() {
      const token = Math.random().toString(16).slice(2, 10);
      state.webhookUrl = `${defaultOrigin()}/api/v1/webhooks/github/wh_${token}`;
      renderMainView();
      showToast('Đã tạo mới Webhook Secret URL!', 'info');
    }

    async function testVpsConnection() {
      if (!canUseBackend()) {
        showToast('Backend chưa kết nối', 'error');
        return;
      }
      const t0 = typeof performance !== 'undefined' ? performance.now() : Date.now();
      try {
        await apiFetch('/health');
        await refreshOverview();
        const elapsed = Math.max(1, Math.round((typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0));
        state.vps.connStatus = `Connected (${state.vps.dockerVersion || 'Docker Engine'}) • ${elapsed}ms`;
        renderMainView();
        showToast(`Ping Docker Engine (${state.vps.socketEndpoint || 'local'}) thành công (${elapsed}ms)!`, 'success');
      } catch (err) {
        showToast(err && err.message ? err.message : 'Không thể kết nối Docker Engine', 'error');
      }
    }

      showToast(`Đã lưu cấu hình kết nối VPS ${state.vps.ip}`, 'success');
    }

    async function fetchSslOverview(opts = {}) {
      if (!canUseBackend()) return false;
      state.ssl.loading = true;
      if (!opts.skipRender && state.activeTab === 'proxy') renderMainView();
      try {
        const res = await apiFetch('/ssl/status');
        if (res && res.settings) state.ssl.settings = res.settings;
        if (res && Array.isArray(res.probes)) state.ssl.probes = res.probes;
        state.ssl.loading = false;
        if (!opts.skipRender) renderMainView();
        if (!opts.silent) showToast('Đã cập nhật trạng thái DNS & Let\'s Encrypt SSL', 'success');
        return true;
      } catch (err) {
        state.ssl.loading = false;
        if (!opts.skipRender) renderMainView();
        return false;
      }
    }

    function toggleEditCloudflareWildcard(editing) {

      if (cf.editingWildcard) {

    function toggleEditCloudflareHub(editing) {
      const cf = state.cloudflare;
      const cfg = cf.config || {};
      cf.editingHub = Boolean(editing);
      if (cf.editingHub && cfg.hubDomain && cfg.baseDomain) {
        const suffix = '.' + cfg.baseDomain.toLowerCase();

    async function fetchCloudflareStatus(opts = {}) {
      if (!canUseBackend()) return false;
      if (state.cloudflare.loading && !opts.allowConcurrent) return false;
      state.cloudflare.loading = true;
      state.cloudflare.error = '';
      if (!opts.skipRender && state.activeTab === 'proxy') renderMainView();
      try {
        const res = await apiFetch('/cloudflare/status');
        if (res && res.config) state.cloudflare.config = res.config;
        if (res && res.serverIp) {
          if (!state.cloudflare.form.serverIp) state.cloudflare.form.serverIp = res.serverIp;
          if (!state.cloudflare.newRecord.content) state.cloudflare.newRecord.content = res.serverIp;
        }
        if (res && Array.isArray(res.records)) state.cloudflare.records = res.records;
        if (res && res.error) state.cloudflare.error = res.error;
        if (!state.cloudflare.editingWildcard && state.cloudflare.config && state.cloudflare.config.enabled) {
          state.cloudflare.wildcardForm.proxied = Boolean(state.cloudflare.config.defaultProxied);
        }
        if (state.cloudflare.config.enabled && state.cloudflare.config.baseDomain && state.wizard.domain.includes('.sslip.io')) {
          state.wizard.domain = defaultAppDomain(state.wizard.appName);
        }
        state.cloudflare.loading = false;
        if (!opts.skipRender) renderMainView();
        if (!opts.silent) showToast('Đã đồng bộ cấu hình & DNS Cloudflare!', 'success');
        return true;
      } catch (err) {
        state.cloudflare.loading = false;
        state.cloudflare.error = err && err.message ? err.message : 'Không thể tải trạng thái Cloudflare';
        if (!opts.skipRender && state.activeTab === 'proxy') renderMainView();
        return false;
      }
    }

    async function connectCloudflare(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (!canUseBackend()) return;
      const cf = state.cloudflare;
      if (cf.connecting) return;
      cf.connecting = true;
      cf.error = '';
      renderMainView();
      try {
        const res = await apiFetch('/cloudflare/connect', {
          method: 'POST',
          timeoutMs: 15000,
          body: JSON.stringify({
            apiToken: (cf.form.apiToken || '').trim(),
            baseDomain: (cf.form.baseDomain || '').trim(),
            serverIp: (cf.form.serverIp || '').trim(),
            defaultProxied: Boolean(cf.form.defaultProxied)
          })
        });
        if (res && res.config) cf.config = res.config;
        if (res && Array.isArray(res.zones)) cf.zones = res.zones;
        if (res && Array.isArray(res.records)) cf.records = res.records;
        cf.form.apiToken = '';
        cf.editingWildcard = false;
        cf.editingHub = false;
        cf.connecting = false;
        if (cf.config && cf.config.baseDomain) {
          state.wizard.domain = defaultAppDomain(state.wizard.appName);
        }
        renderMainView();
        showToast(`Đã kết nối Cloudflare Zone ${cf.config.baseDomain}!`, 'success');
      } catch (err) {
        cf.connecting = false;
        cf.error = err && err.message ? err.message : 'Kết nối Cloudflare thất bại';
        renderMainView();
        showToast(cf.error, 'error');
      }
    }

    async function disconnectCloudflare() {
      if (!canUseBackend()) return;
      const cf = state.cloudflare;
      if (cf.disconnecting) return;
      if (typeof window !== 'undefined' && typeof window.confirm === 'function' && !window.confirm('Ngắt kết nối Cloudflare API? Token mã hóa sẽ bị xóa khỏi DeploymentHub (các DNS record trên Cloudflare vẫn được giữ nguyên).')) {
        return;
      }
      cf.disconnecting = true;
      cf.error = '';
      renderMainView();
      try {
        const res = await apiFetch('/cloudflare/disconnect', { method: 'POST' });
        cf.config = (res && res.config) || { enabled: false };
        cf.records = [];
        cf.editingWildcard = false;
        cf.editingHub = false;
        cf.error = '';
        showToast('Đã ngắt kết nối Cloudflare API', 'warn');
      } catch (err) {
        showToast(err && err.message ? err.message : 'Lỗi ngắt kết nối Cloudflare', 'error');
      } finally {
        cf.disconnecting = false;
        renderMainView();
      }
    }

      if (cf.settingUpWildcard) return;
      cf.settingUpWildcard = true;

      renderMainView();
      try {
        const res = await apiFetch('/cloudflare/wildcard', {
          method: 'POST',
          timeoutMs: 45000,

        cf.error = err && err.message ? err.message : 'Lỗi thiết lập Wildcard Cloudflare';

        showToast(cf.error, 'error');

    async function toggleCloudflareRecordProxy(name, content, proxied) {
      if (!canUseBackend()) return;
      const cf = state.cloudflare;
      if (!cf.busyRecordKeys) cf.busyRecordKeys = {};
      if (cf.busyRecordKeys[name]) return;
      cf.busyRecordKeys[name] = true;
      renderMainView();
      try {
        await apiFetch('/cloudflare/dns', {
          method: 'POST',
          body: JSON.stringify({ name, content, proxied: Boolean(proxied) })
        });
        await fetchCloudflareStatus({ silent: true, skipRender: true, allowConcurrent: true });
        showToast(`${name}: ${proxied ? 'Đã bật Cloudflare Orange Cloud ☁️' : 'Đã chuyển sang DNS Only'}`, 'success');
      } catch (err) {
        showToast(err && err.message ? err.message : 'Lỗi cập nhật Proxy Cloudflare', 'error');
      } finally {
        delete cf.busyRecordKeys[name];
        renderMainView();
      }
    }

    async function deleteCloudflareDnsRecord(id, name) {
      if (!canUseBackend()) return;
      const cf = state.cloudflare;
      if (!cf.busyRecordKeys) cf.busyRecordKeys = {};
      if (cf.busyRecordKeys[id]) return;
      if (typeof window !== 'undefined' && typeof window.confirm === 'function' && !window.confirm(`Xóa DNS record "${name}" trên Cloudflare?`)) {
        return;
      }
      cf.busyRecordKeys[id] = true;
      renderMainView();
      try {
        await apiFetch(`/cloudflare/dns/${encodeURIComponent(id)}`, { method: 'DELETE' });
        await fetchCloudflareStatus({ silent: true, skipRender: true, allowConcurrent: true });
        showToast(`Đã xóa DNS record ${name}`, 'warn');
      } catch (err) {
        showToast(err && err.message ? err.message : 'Lỗi xóa DNS record', 'error');
      } finally {
        delete cf.busyRecordKeys[id];
        renderMainView();
      }
    }

    function openSslModal(projectId) {
      state.mah.settingsOpen = false;
      state.mah.registerAgentOpen = false;
      const proj = (state.projects || []).find(p => p.id === projectId || p.name === projectId);
      if (!proj) return;
      const currentDomain = proj.domain || defaultAppDomain(proj.name);
      const probe = (state.ssl?.probes || []).find(pr => pr.domain === currentDomain) || null;
      const rt = (state.proxyRoutes || []).find(r => r.domain === currentDomain || String(r.target || '').includes(proj.name));
      const cfCfg = state.cloudflare?.config || {};
      const underCF = Boolean(cfCfg.enabled && cfCfg.baseDomain && currentDomain.endsWith(cfCfg.baseDomain));
      state.modal = {
        open: true,
        type: 'ssl',
        targetKind: 'project',
        targetId: proj.id,
        logFilter: '',
        sslForm: {
          domain: currentDomain,
          enableSsl: rt ? Boolean(rt.ssl) : true,
          forceHttps: Boolean(state.ssl?.settings?.autoRedirectHttps),
          cloudflareSyncDns: Boolean(cfCfg.enabled && !cfCfg.wildcardEnabled && underCF),
          cloudflareProxied: Boolean(cfCfg.defaultProxied),
          saving: false,
          probing: false,
          probe,
          error: ''
        }
      };
      renderModal();
      probeModalSsl(true);
    }

    async function probeModalSsl(silent = false) {
      const f = state.modal && state.modal.sslForm;
      if (!f || !f.domain || !canUseBackend()) return;
      f.probing = true;
      f.error = '';
      if (state.modal.open && state.modal.type === 'ssl') renderModal();
      try {
        const res = await apiFetch('/ssl/probe', {
          method: 'POST',
          body: JSON.stringify({ domain: f.domain.trim() })
        });
        f.probe = res;
        f.probing = false;
        if (state.modal.open && state.modal.type === 'ssl') renderModal();
        if (!silent) showToast(`Kiểm tra TLS ${f.domain}: ${res.statusLabel || 'Xong'}`, 'info');
      } catch (err) {
        f.probing = false;
        f.error = err && err.message ? err.message : 'Không thể kiểm tra TLS';
        if (state.modal.open && state.modal.type === 'ssl') renderModal();
      }
    }

    async function saveProjectSsl(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      const f = state.modal && state.modal.sslForm;
      if (!f || !canUseBackend() || f.saving) return;
      f.saving = true;
      f.error = '';
      renderModal();
      try {
        const res = await apiFetch(`/projects/${encodeURIComponent(state.modal.targetId)}/ssl`, {
          method: 'POST',
          timeoutMs: 30000,
          body: JSON.stringify({
            domain: f.domain.trim(),
            enableSsl: Boolean(f.enableSsl),
            forceHttps: Boolean(f.forceHttps),
            cloudflareSyncDns: Boolean(f.cloudflareSyncDns),
            cloudflareProxied: Boolean(f.cloudflareProxied)
          })
        });
        if (res && res.probe) {
          f.probe = res.probe;
        }
        if (res && res.project && res.project.domain) {
          f.domain = res.project.domain;
        }
        const savedDomain = f.domain;
        const trusted = Boolean(f.probe && f.probe.trustedLetsEncrypt);
        f.saving = false;
        await refreshOverview();
        await fetchSslOverview({ silent: true, skipRender: true });
        if (f.cloudflareSyncDns) {
          await fetchCloudflareStatus({ silent: true, skipRender: true, allowConcurrent: true });
        }
        closeModal();
        renderAll();
        showToast(
          trusted
            ? `Đã cấp chứng chỉ Let's Encrypt thành công cho https://${savedDomain}!`
            : `Đã cập nhật route SSL cho ${savedDomain}!`,
          'success'
        );
      } catch (err) {
        f.saving = false;
        f.error = err && err.message ? err.message : 'Cấu hình SSL thất bại';
        renderModal();
        showToast(f.error, 'error');
      }
    }

    function stopModalLogStream() {
      const ls = state.docker && state.docker.logStream;
      if (!ls) return;
      if (ls.es) {
        try { ls.es.close(); } catch {}
        ls.es = null;
      }
      ls.connected = false;
    }

    function openLogsModal(kind, id) {
      stopModalLogStream();
      state.mah.settingsOpen = false;
      state.mah.registerAgentOpen = false;
      state.docker.logStream.follow = false;
      state.modal = { open: true, type: 'logs', targetKind: kind, targetId: id, logFilter: '', sslForm: state.modal.sslForm };
      renderModal();
      refreshModalLogs(true);
    }

    function toggleModalLogFollow() {
      const ls = state.docker.logStream;
      if (ls.follow) {
        ls.follow = false;
        stopModalLogStream();
        renderModal();
        return;
      }
      const entity = state.modal.targetKind === 'project'
        ? state.projects.find(p => p.id === state.modal.targetId)
        : state.containers.find(c => c.id === state.modal.targetId);
      if (!entity || !canUseBackend() || typeof EventSource === 'undefined') {
        showToast('Live SSE không khả dụng ở chế độ này.', 'warn');
        return;
      }
      stopModalLogStream();
      ls.follow = true;
      entity.logs = [];
      renderModal();

      const ts = ls.timestamps ? '1' : '0';
      const es = new EventSource(`/api/v1/containers/${encodeURIComponent(entity.id)}/logs/stream?tail=200&timestamps=${ts}`);
      ls.es = es;
      es.onopen = () => {
        ls.connected = true;
        const badge = document.getElementById('modalLogLiveBadge');
        if (badge) badge.textContent = '● Live SSE';
      };
      es.addEventListener('log', (ev) => {
        try {
          const msg = JSON.parse(ev.data || '{}');
          if (typeof msg.line === 'string') {
            if (!Array.isArray(entity.logs)) entity.logs = [];
            entity.logs.push(msg.line);
            if (entity.logs.length > 2000) entity.logs = entity.logs.slice(-1500);
            renderModalLogLines();
          }
        } catch {}
      });
      es.addEventListener('end', () => {
        ls.follow = false;
        stopModalLogStream();
        if (state.modal.open && state.modal.type === 'logs') renderModal();
      });
      es.onerror = () => {
        ls.connected = false;
        if (!ls.follow) return;
        const badge = document.getElementById('modalLogLiveBadge');
        if (badge) badge.textContent = '○ Reconnecting...';
      };
    }

    function toggleModalLogTimestamps(checked) {
      state.docker.logStream.timestamps = Boolean(checked);
      if (state.docker.logStream.follow) {
        state.docker.logStream.follow = false;
        stopModalLogStream();
        toggleModalLogFollow();
      }
    }

    async function openInspectModal(containerId) {
      stopModalLogStream();
      state.mah.settingsOpen = false;
      state.mah.registerAgentOpen = false;
      const ins = state.docker.inspect;
      ins.tab = 'overview';
      ins.loading = true;
      ins.error = '';
      ins.data = null;
      ins.stats = null;
      ins.top = null;
      state.modal = { open: true, type: 'inspect', targetKind: 'container', targetId: containerId, logFilter: '', sslForm: state.modal.sslForm };
      renderModal();

      if (!canUseBackend()) {
        ins.loading = false;
        const cnt = state.containers.find(c => c.id === containerId);
        if (cnt) {
          ins.data = {
            id: cnt.id, fullId: cnt.id, name: cnt.name, image: cnt.image,
            protected: isProtectedContainer(cnt),
            state: { status: cnt.status, running: cnt.status === 'Running', health: 'none', healthLogs: [] },
            env: [], cmd: [], mounts: [], networks: [], labels: {},
            restartPolicy: 'unless-stopped', memoryLimitMb: cnt.ramLimitMb || 512, cpuCores: 1, ports: cnt.ports
          };
        }
        renderModal();
        return;
      }

      try {
        const [data, stats, top] = await Promise.all([
          apiFetch(`/containers/${encodeURIComponent(containerId)}/inspect`),
          apiFetch(`/containers/${encodeURIComponent(containerId)}/stats`).catch(() => null),
          apiFetch(`/containers/${encodeURIComponent(containerId)}/top`).catch(() => null)
        ]);
        ins.data = data;
        ins.stats = stats;
        ins.top = top;
        ins.form = {
          memoryMb: (data && data.memoryLimitMb > 0) ? data.memoryLimitMb : 512,
          cpuCores: (data && data.cpuCores > 0) ? data.cpuCores : 1,
          restartPolicy: (data && data.restartPolicy) ? data.restartPolicy : 'unless-stopped'
        };
      } catch (err) {
        ins.error = err && err.message ? err.message : 'Không thể inspect container';
      } finally {
        ins.loading = false;
        if (state.modal.open && state.modal.type === 'inspect') renderModal();
      }
    }

    async function refreshInspectStatsAndTop() {
      const id = state.modal && state.modal.targetId;
      if (!id || !canUseBackend()) return;
      const ins = state.docker.inspect;
      try {
        const [stats, top] = await Promise.all([
          apiFetch(`/containers/${encodeURIComponent(id)}/stats`).catch(() => ins.stats),
          apiFetch(`/containers/${encodeURIComponent(id)}/top`).catch(() => ins.top)
        ]);
        ins.stats = stats;
        ins.top = top;
        if (state.modal.open && state.modal.type === 'inspect') renderModal();
      } catch {}
    }

    async function saveContainerResourceLimits(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      const id = state.modal && state.modal.targetId;
      const ins = state.docker.inspect;
      if (!id || !canUseBackend() || ins.savingLimits) return;
      ins.savingLimits = true;
      renderModal();
      try {
        await apiFetch(`/containers/${encodeURIComponent(id)}/update`, {
          method: 'POST',
          body: JSON.stringify({
            memoryMb: Number(ins.form.memoryMb) || 0,
            cpuCores: Number(ins.form.cpuCores) || 0,
            restartPolicy: ins.form.restartPolicy || ''
          })
        });
        showToast('Đã cập nhật giới hạn CPU / RAM / RestartPolicy (hot-update)!', 'success');
        await refreshOverview();
        await openInspectModal(id);
      } catch (err) {
        showToast(err && err.message ? err.message : 'Cập nhật limits thất bại', 'error');
      } finally {
        ins.savingLimits = false;
        if (state.modal.open && state.modal.type === 'inspect') renderModal();
      }
    }

    async function openImageHistoryModal(id, repoTag) {
      stopModalLogStream();
      state.mah.settingsOpen = false;
      state.mah.registerAgentOpen = false;
      const ih = state.docker.imageHistory;
      ih.id = id;
      ih.repoTag = repoTag || id;
      ih.loading = true;
      ih.error = '';
      ih.layers = [];
      state.modal = { open: true, type: 'imageHistory', targetKind: 'image', targetId: id, logFilter: '', sslForm: state.modal.sslForm };
      renderModal();

      if (!canUseBackend()) {
        ih.loading = false;
        renderModal();
        return;
      }
      try {
        const res = await apiFetch(`/images/${encodeURIComponent(id)}/history`);
        ih.layers = Array.isArray(res.layers) ? res.layers : [];
      } catch (err) {
        ih.error = err && err.message ? err.message : 'Không thể tải Image History';
      } finally {
        ih.loading = false;
        if (state.modal.open && state.modal.type === 'imageHistory') renderModal();
      }
    }

      stopModalLogStream();
      state.mah.settingsOpen = false;

      if (!root) return;
      const focusSaved = captureFocusState(root);
